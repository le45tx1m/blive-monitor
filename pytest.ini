[pytest]
# 只收集根 tests/ 下的用例；blive-monitor-handoff/ 是交付副本（按需求保留在仓库供其他工具查阅），
# 其 tests/ 与根 tests/ 同名文件会造成 pytest import file mismatch，故显式限定 testpaths 排除之。
testpaths = tests
addopts = --cov=. --cov-report=term-missing --cov-report=html --cov-config=pytest.ini

[coverage:run]
source = .
omit =
    tests/*
    tools/*
    docs/*
    backend/migrations/*
    */__pycache__/*
    setup.py
    conftest.py

[coverage:report]
show_missing = True
precision = 2
