<!DOCTYPE html>
<!--
  本原型基于 blive-monitor「Phase 2 彩格调」设计系统。
  所有视觉令牌（颜色/排版/间距/圆角/阴影）以 CSS 变量形式落地，
  暗色为默认，亮色通过 @media (prefers-color-scheme: light) 自动切换。
  单文件、零构建，直接浏览器打开即可运行。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>blive-monitor · 重构原型</title>
<style>
/* ============================================================
   1. 设计令牌（Design Tokens）—— 全部 CSS 变量化
   ============================================================ */
:root{
  /* 颜色 · 暗色（默认） */
  --bg-base:#0d0e12; --bg-surface:#14161c; --bg-elevated:#1c1f27;
  --bg-card:#16181f; --border-subtle:#23262f; --border-default:#2e323d;
  --border-strong:#3d4250; --text-primary:#eceef2; --text-secondary:#9aa1ad;
  --text-tertiary:#646b78;
  --brand:#fe2c55; --brand-hover:#ff4775; --brand-soft:#ff7aa0;
  --ink:#000; --on-brand:#fff;
  --bili:#00AEEC; --douyin:#fe2c55; --xhs:#ff2442;
  --status-live:#2dd4a7; --status-offline:#6b7280; --status-newpost:#8b7cff;
  --status-warning:#f5a623; --status-error:#ff4d4f;
  /* 阴影 · 暗 */
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.5);
  --shadow-lg:0 8px 24px rgba(0,0,0,.6);
  /* 间距阶梯（1=4 … 8=32） */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
  --s6:24px; --s7:28px; --s8:32px;
  /* 圆角 */
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px; --r-full:999px;
  /* 字号阶梯 */
  --fs-xs:11px; --fs-sm:12px; --fs-base:14px; --fs-md:16px;
  --fs-lg:18px; --fs-xl:22px;
  /* 字体 */
  --font:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
}

/* 颜色 · 亮色（自动切换） */
@media (prefers-color-scheme: light){
  :root{
    --bg-base:#f6f7f9; --bg-surface:#ffffff; --bg-elevated:#ffffff;
    --bg-card:#ffffff; --border-subtle:#eceef1; --border-default:#dde1e6;
    --border-strong:#c3c9d2; --text-primary:#1a1d23; --text-secondary:#5b626e;
    --text-tertiary:#8b929e;
    /* 亮色模式：平台色 / 状态色加深，确保 colored text 在浅底上 ≥4.5:1（WCAG AA） */
    --brand:#e01e4a; --brand-hover:#c8123a; --brand-soft:#ff8aa6;
    --bili:#0a6fb0; --douyin:#e01e4a; --xhs:#d11a33;
    --status-live:#15803d; --status-offline:#475569; --status-newpost:#4438dc;
    --status-warning:#b45309; --status-error:#e03131;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 12px rgba(15,23,42,.08);
    --shadow-lg:0 8px 24px rgba(15,23,42,.10);
  }
}

/* ============================================================
   2. 基础与布局
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg-base);}
body{
  font-family:var(--font); font-size:var(--fs-base); color:var(--text-primary);
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
/* 移动端优先：480px 居中容器，模拟手机视口 */
.app{
  position:relative; max-width:480px; margin:0 auto; min-height:100vh;
  background:var(--bg-base); padding-bottom:calc(56px + env(safe-area-inset-bottom,0));
}
.topbar{
  position:sticky; top:0; z-index:20; height:52px; display:flex; align-items:center;
  gap:var(--s2); padding:0 var(--s4);
  background:color-mix(in srgb,var(--bg-elevated) 92%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border-subtle);
}
.topbar .logo{
  width:22px;height:22px;border-radius:var(--r-sm);
  background:linear-gradient(135deg,var(--brand),var(--brand-soft));
  display:flex;align-items:center;justify-content:center;
  color:var(--on-brand);font-weight:700;font-size:var(--fs-sm);
}
.topbar .title{font-weight:600;font-size:var(--fs-md);}
.topbar .sub{font-size:var(--fs-xs);color:var(--text-tertiary);margin-left:auto;}

.content{padding:var(--s4);}
.view{display:none;}
.view.active{display:block; animation:fade .18s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ============================================================
   3. 通用组件（统一视觉语言的核心）
   ============================================================ */
/* 区块头：标题左 + count 徽标右 */
.section-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:var(--s4); font-size:var(--fs-lg); font-weight:600;
}
.count-badge{
  font-size:var(--fs-xs); font-weight:600; color:var(--text-secondary);
  background:var(--bg-elevated); border:1px solid var(--border-default);
  padding:2px 9px; border-radius:var(--r-full); line-height:1.4;
}

/* 卡片：统一圆角/边框/内距/阴影 */
.card{
  background:var(--bg-card); border:1px solid var(--border-default);
  border-radius:var(--r-md); padding:var(--s3); box-shadow:var(--shadow-sm);
}

/* 操作行（按钮容器） */
.action-row{display:flex; gap:var(--s2); margin:0 var(--s4) var(--s3);}
.list{display:flex; flex-direction:column; gap:var(--s3); padding:0 var(--s4) var(--s4);}

/* 按钮 */
.btn{
  font-family:var(--font); font-size:var(--fs-base); font-weight:600;
  border:none; cursor:pointer;   border-radius:var(--r-md);
  padding:var(--s2) var(--s4); transition:background .15s,transform .05s,opacity .15s;
  display:inline-flex; align-items:center; gap:var(--s2); justify-content:center;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brand); color:var(--on-brand);}
.btn-primary:hover{background:var(--brand-hover);}
.btn-secondary{background:transparent; color:var(--text-primary); border:1px solid var(--border-strong);}
.btn-secondary:hover{background:var(--bg-elevated);}
.btn-danger{background:var(--status-error); color:var(--on-brand);}
.btn-danger:hover{opacity:.9;}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);}
.btn-ghost:hover{background:var(--bg-elevated);color:var(--text-primary);}
.btn-sm{padding:6px 12px;font-size:var(--fs-sm);}
.btn-brand-soft{
  background:color-mix(in srgb, var(--brand) 12%, transparent);
  color:var(--brand); border:none; border-radius:var(--r-full);
  padding:var(--s1) var(--s3); font-size:var(--fs-sm); cursor:pointer;
}
.btn-brand-soft:hover{background:color-mix(in srgb, var(--brand) 18%, transparent);}
.w-full{width:100%;}

/* 图标按钮（36 方 · 全圆） */
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-full);
  background:var(--bg-elevated); border:1px solid var(--border-default);
  color:var(--text-secondary); cursor:pointer; font-size:var(--fs-lg); line-height:1;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--bg-surface); color:var(--text-primary);}

/* 复选框（18px · 选中品牌色） */
.checkbox{
  width:18px;height:18px;border-radius:var(--r-sm);border:1.5px solid var(--border-strong);
  background:transparent; cursor:pointer; position:relative; flex-shrink:0;
  -webkit-appearance:none; appearance:none; transition:.15s;
}
.checkbox:checked{background:var(--brand);border-color:var(--brand);}
.checkbox:checked::after{
  content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
  border:solid var(--on-brand);border-width:0 2px 2px 0;transform:rotate(45deg);
}

/* 状态 / 平台徽标（pill + 14% 透明底色） */
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:var(--fs-xs); font-weight:600; padding:3px 9px;
  border-radius:var(--r-full); line-height:1; white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pf-tag{padding:2px 8px;}
.pf-bili{color:var(--bili);background:color-mix(in srgb,var(--bili) 14%,transparent);}
.pf-douyin{color:var(--douyin);background:color-mix(in srgb,var(--douyin) 14%,transparent);}
.pf-xhs{color:var(--xhs);background:color-mix(in srgb,var(--xhs) 14%,transparent);}
.badge-live{color:var(--status-live);background:color-mix(in srgb,var(--status-live) 14%,transparent);}
.badge-offline{color:var(--status-offline);background:color-mix(in srgb,var(--status-offline) 14%,transparent);}
.badge-newpost{color:var(--status-newpost);background:color-mix(in srgb,var(--status-newpost) 14%,transparent);}
.badge-warning{color:var(--status-warning);background:color-mix(in srgb,var(--status-warning) 14%,transparent);}
.badge-error{color:var(--status-error);background:color-mix(in srgb,var(--status-error) 14%,transparent);}

/* 表单控件 */
.field{display:flex;flex-direction:column;gap:var(--s2);margin-bottom:var(--s4);}
.field label{font-size:var(--fs-sm);color:var(--text-secondary);font-weight:500;}
.input,.select{
  font-family:var(--font);font-size:var(--fs-base);color:var(--text-primary);
  background:var(--bg-surface);border:1px solid var(--border-default);
  border-radius:var(--r-md);padding:10px 12px;width:100%;transition:border-color .15s;
}
.input:focus,.select:focus{outline:none;border-color:var(--brand);}
.input::placeholder{color:var(--text-tertiary);}

/* 头像（彩色渐变占位 + 首字） */
.avatar{
  width:42px;height:42px;border-radius:var(--r-full);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--on-brand);font-weight:600;font-size:var(--fs-md);
}

/* 卡片内行布局 */
.row{display:flex;align-items:center;gap:var(--s3);}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.muted{color:var(--text-secondary);}
.tertiary{color:var(--text-tertiary);font-size:var(--fs-sm);}
.name{font-weight:600;font-size:var(--fs-base);}

/* 隐藏表单 / 菜单 */
.hidden{display:none!important;}

/* 更多菜单 */
.more-wrap{position:relative;}
.menu{
  position:absolute; right:0; top:42px; z-index:30; min-width:128px;
  background:var(--bg-elevated); border:1px solid var(--border-default);
  border-radius:var(--r-md); box-shadow:var(--shadow-md); padding:var(--s1);
  display:none;
}
.menu.open{display:block;}
.menu button{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--text-primary);font-family:var(--font);font-size:var(--fs-sm);
  padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;
}
.menu button:hover{background:var(--bg-surface);}
.menu button.danger{color:var(--status-error);}

/* 仪表盘统计网格 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.stat .stat-val{font-size:var(--fs-xl);font-weight:700;margin-top:var(--s1);}
.stat .stat-label{font-size:var(--fs-sm);color:var(--text-secondary);}

/* ============================================================
   4. 底部 Tabbar（固定 · 选中品牌色）
   ============================================================ */
.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; height:56px;
  display:flex; background:var(--bg-elevated);
  border-top:1px solid var(--border-subtle);
  padding-bottom:env(safe-area-inset-bottom,0); z-index:40;
}
.tab{
  flex:1; border:none; background:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; color:var(--text-tertiary); font-family:var(--font);
  font-size:var(--fs-xs); transition:color .15s;
}
.tab svg{width:22px;height:22px;}
.tab.active{color:var(--brand);}
.tab.active svg{stroke:var(--brand);}

/* 动效降级：尊重系统「减少动态效果」偏好 */
@media (prefers-reduced-motion: reduce){
  *{transition:none!important; animation:none!important;}
  .view.active{animation:none;}
}
</style>
</head>
<body>
<div class="app">

  <!-- 顶部条 -->
  <header class="topbar">
    <div class="logo">B</div>
    <div class="title">blive-monitor</div>
    <div class="sub">彩格调 · 重构原型</div>
  </header>

  <main class="content">

    <!-- ============ 视图 1：直播 live ============ -->
    <section id="view-live" class="view active">
      <div class="section-header">
        <span>直播监控</span>
        <span class="count-badge" id="live-count">0</span>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" id="toggle-add-form">＋ 添加监控</button>
      </div>

      <!-- 添加房间表单（默认隐藏，点击显隐） -->
      <div id="live-add-form" class="card hidden" style="margin:0 var(--s4) var(--s3);">
        <div class="field">
          <label>平台</label>
          <select class="select" id="af-platform">
            <option value="bili">哔哩哔哩</option>
            <option value="douyin">抖音</option>
            <option value="xhs">小红书</option>
          </select>
        </div>
        <div class="field">
          <label>房间 / 用户 ID</label>
          <input class="input" id="af-id" placeholder="例如 123456">
        </div>
        <div class="field">
          <label>名称</label>
          <input class="input" id="af-name" placeholder="房间备注名">
        </div>
        <div class="row" style="gap:var(--s2);">
          <button class="btn btn-primary" id="af-submit">保存</button>
          <button class="btn btn-ghost" id="af-cancel">取消</button>
        </div>
      </div>

      <div id="live-list" class="list"></div>
    </section>

    <!-- ============ 视图 2：新作 posts ============ -->
    <section id="view-posts" class="view">
      <div class="section-header">
        <span>新作监控</span>
        <span class="count-badge" id="posts-count">0</span>
      </div>
      <!-- 全选控制栏 -->
      <div class="card" style="margin:0 var(--s4) var(--s3);">
        <div class="row-between">
          <label class="row" style="gap:var(--s2);cursor:pointer;">
            <input type="checkbox" class="checkbox" id="select-all">
            <span class="name">全选</span>
          </label>
          <button class="btn btn-secondary btn-sm" id="batch-manage">批量管理</button>
        </div>
      </div>
      <div id="posts-list" class="list"></div>
    </section>

    <!-- ============ 视图 3：日志 log ============ -->
    <section id="view-log" class="view">
      <div class="section-header">
        <span>监控日志</span>
        <span class="count-badge" id="log-count">0</span>
      </div>
      <div id="log-list" class="list"></div>
    </section>

    <!-- ============ 视图 4：配置 config ============ -->
    <section id="view-config" class="view">
      <div class="section-header"><span>配置</span></div>
      <div class="list">
        <div class="card">
          <div class="name" style="margin-bottom:var(--s2);">API Token</div>
          <div class="tertiary" style="margin-bottom:var(--s3);">
            用于读取各平台直播 / 作品数据的访问令牌。
          </div>
          <div class="field" style="margin-bottom:var(--s3);">
            <input class="input" id="cfg-token" type="password"
                   placeholder="粘贴你的 token（本地演示，不会上传）">
          </div>
          <button class="btn btn-secondary btn-sm" id="cfg-save-token">保存 Token</button>
        </div>

        <div class="card">
          <div class="name" style="margin-bottom:var(--s3);">添加监控房间</div>
          <div class="field">
            <label>平台</label>
            <select class="select" id="cfg-platform">
              <option value="bili">哔哩哔哩</option>
              <option value="douyin">抖音</option>
              <option value="xhs">小红书</option>
            </select>
          </div>
          <div class="field">
            <label>ID</label>
            <input class="input" id="cfg-id" placeholder="房间 / 用户 ID">
          </div>
          <div class="field">
            <label>名称</label>
            <input class="input" id="cfg-name" placeholder="备注名">
          </div>
          <button class="btn btn-primary btn-sm" id="cfg-add-room">添加</button>
        </div>

        <div class="card">
          <div class="name" style="margin-bottom:var(--s2);">标签说明</div>
          <div class="tertiary" style="line-height:1.7;">
            · <b>直播中</b>：房间正在开播<br>
            · <b>离线</b>：未检测到直播<br>
            · <b>新作</b>：检测到新发布作品<br>
            · <b>异常</b>：抓取失败或令牌失效
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 视图 5：仪表盘 dashboard ============ -->
    <section id="view-dashboard" class="view">
      <div class="section-header"><span>概览</span></div>
      <div class="list">
        <div class="grid">
          <div class="card stat">
            <div class="stat-label">今日开播次数</div>
            <div class="stat-val" id="stat-live">—</div>
          </div>
          <div class="card stat">
            <div class="stat-label">监控房间数</div>
            <div class="stat-val" id="stat-rooms">—</div>
          </div>
          <div class="card stat">
            <div class="stat-label">异常数</div>
            <div class="stat-val" id="stat-error">—</div>
          </div>
          <div class="card stat">
            <div class="stat-label">新作数</div>
            <div class="stat-val" id="stat-post">—</div>
          </div>
        </div>
        <div class="card">
          <div class="name" style="margin-bottom:var(--s3);">平台分布</div>
          <div id="dash-platforms"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- 底部 Tabbar：5 个视图切换 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="live" aria-label="直播">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
      直播
    </button>
    <button class="tab" data-view="posts" aria-label="新作">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M10 8l6 4-6 4z"/></svg>
      新作
    </button>
    <button class="tab" data-view="log" aria-label="日志">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      日志
    </button>
    <button class="tab" data-view="config" aria-label="配置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"/></svg>
      配置
    </button>
    <button class="tab" data-view="dashboard" aria-label="仪表盘">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
      仪表盘
    </button>
  </nav>
</div>

<script>
/* ============================================================
   Mock 数据 —— 字段名与真实 rooms.json / post_rooms.json / history.json 对齐
   ============================================================ */
const data = {
  // rooms.json：rooms[].platform / id / name / enabled / live / online
  rooms: [
    { platform:'bili',   id:'23179431', name:'代码与诗',       enabled:true,  live:true,  online:1284 },
    { platform:'douyin', id:'dy_8842',  name:'山野手作',       enabled:true,  live:false, online:0 },
    { platform:'xhs',    id:'xhs_5521', name:'晚风杂货铺',     enabled:true,  live:true,  online:642 },
    { platform:'bili',   id:'998102',   name:'深夜电台 FM',     enabled:false, live:false, online:0 },
  ],
  // post_rooms.json：post_rooms[].platform / id / name / enabled / lastTitle / lastTime
  post_rooms: [
    { platform:'douyin', id:'dy_8842',  name:'山野手作',   enabled:true, lastTitle:'手冲咖啡的一天', lastTime:'12 分钟前' },
    { platform:'douyin', id:'dy_3320',  name:'阿木的厨房', enabled:true, lastTitle:'三分钟葱油拌面', lastTime:'1 小时前' },
    { platform:'xhs',    id:'xhs_5521', name:'晚风杂货铺', enabled:true, lastTitle:'秋日穿搭合集',   lastTime:'3 小时前' },
  ],
  // history.json：history[].type / name / title / time
  history: [
    { type:'live_start', name:'代码与诗',   title:'',            time:'20:14' },
    { type:'new_post',   name:'山野手作',   title:'手冲咖啡的一天', time:'20:02' },
    { type:'live_end',   name:'深夜电台 FM', title:'',           time:'19:40' },
    { type:'error',      name:'阿木的厨房', title:'令牌已失效',    time:'18:55' },
    { type:'new_post',   name:'晚风杂货铺', title:'秋日穿搭合集',  time:'17:30' },
    { type:'live_start', name:'晚风杂货铺', title:'',            time:'16:05' },
  ],
};

const PLATFORM_NAME = { bili:'哔哩哔哩', douyin:'抖音', xhs:'小红书' };
const PLATFORM_COLOR = { bili:'var(--bili)', douyin:'var(--douyin)', xhs:'var(--xhs)' };
const LOG_TYPE = {
  live_start:{ label:'开播', cls:'badge-live' },
  live_end:  { label:'下播', cls:'badge-offline' },
  new_post:  { label:'新作', cls:'badge-newpost' },
  error:     { label:'异常', cls:'badge-error' },
};

/* ---------- 工具 ---------- */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================================================
   渲染：直播 live
   ============================================================ */
function renderLive(){
  const list = $('#live-list');
  $('#live-count').textContent = data.rooms.filter(r=>r.enabled).length;
  list.innerHTML = data.rooms.map(r=>{
    const status = r.live
      ? '<span class="badge badge-live"><span class="dot"></span>直播中</span>'
      : '<span class="badge badge-offline"><span class="dot"></span>离线</span>';
    const online = r.live ? `<span class="tertiary">在线 ${r.online.toLocaleString()}</span>` : '';
    return `
    <div class="card row-between">
      <div class="row">
        <span class="badge pf-tag pf-${r.platform}">${PLATFORM_NAME[r.platform]}</span>
        <div>
          <div class="name">${esc(r.name)}</div>
          <div class="row" style="margin-top:var(--s1);gap:var(--s2);">
            ${status} ${online}
          </div>
        </div>
      </div>
      <div class="row" style="gap:var(--s1);">
        <button class="btn btn-ghost btn-sm" data-action="view-room" data-id="${r.id}">查看</button>
        <button class="btn btn-ghost btn-sm" data-action="edit-room"  data-id="${r.id}">编辑</button>
        <button class="btn btn-danger btn-sm" data-action="remove-room" data-id="${r.id}">移除</button>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   渲染：新作 posts
   ============================================================ */
function renderPosts(){
  const list = $('#posts-list');
  $('#posts-count').textContent = data.post_rooms.filter(r=>r.enabled).length;
  list.innerHTML = data.post_rooms.map(r=>{
    const c = PLATFORM_COLOR[r.platform];
    return `
    <div class="card">
      <div class="row-between">
        <div class="row">
          <input type="checkbox" class="checkbox post-check">
          <div class="avatar" style="background:linear-gradient(135deg,${c},color-mix(in srgb,${c} 60%,var(--ink)));">${esc(r.name[0])}</div>
          <div>
            <div class="row" style="gap:var(--s2);">
              <span class="name">${esc(r.name)}</span>
              <span class="badge pf-tag pf-${r.platform}">${PLATFORM_NAME[r.platform]}</span>
            </div>
            <div class="tertiary" style="margin-top:var(--s1);">${esc(r.lastTitle)} · ${esc(r.lastTime)}</div>
          </div>
        </div>
        <div class="more-wrap">
          <button class="icon-btn" data-action="more" aria-label="更多">⋮</button>
          <div class="menu">
            <button data-action="view-post" data-id="${r.id}">详情</button>
            <button data-action="edit-post"  data-id="${r.id}">编辑</button>
            <button class="danger" data-action="remove-post" data-id="${r.id}">移除</button>
          </div>
        </div>
      </div>
      <button class="btn btn-brand-soft w-full" data-action="view-post" data-id="${r.id}"
        style="margin-top:var(--s3);">
        查看作品
      </button>
    </div>`;
  }).join('');
}

/* ============================================================
   渲染：日志 log
   ============================================================ */
function renderLog(){
  const list = $('#log-list');
  $('#log-count').textContent = data.history.length;
  list.innerHTML = data.history.map(h=>{
    const t = LOG_TYPE[h.type] || {label:h.type,cls:'badge-offline'};
    return `
    <div class="card row-between">
      <div class="row" style="gap:var(--s3);">
        <span class="badge ${t.cls}">${t.label}</span>
        <div>
          <div class="name">${esc(h.name)}</div>
          ${h.title?`<div class="tertiary" style="margin-top:var(--s1);">${esc(h.title)}</div>`:''}
        </div>
      </div>
      <span class="tertiary">${esc(h.time)}</span>
    </div>`;
  }).join('');
}

/* ============================================================
   渲染：仪表盘 dashboard
   ============================================================ */
function renderDashboard(){
  const liveN  = data.history.filter(h=>h.type==='live_start').length;
  const errN   = data.history.filter(h=>h.type==='error').length;
  const postN  = data.history.filter(h=>h.type==='new_post').length;
  const roomN  = data.rooms.filter(r=>r.enabled).length;
  $('#stat-live').textContent  = liveN;
  $('#stat-rooms').textContent = roomN;
  $('#stat-error').textContent = errN;
  $('#stat-post').textContent  = postN;

  const dist = {};
  [...data.rooms, ...data.post_rooms].forEach(r=>{
    dist[r.platform] = (dist[r.platform]||0)+1;
  });
  $('#dash-platforms').innerHTML = Object.entries(dist).map(([p,n])=>`
    <div class="row-between" style="padding:var(--s2) 0;">
      <span class="badge pf-tag pf-${p}">${PLATFORM_NAME[p]}</span>
      <span class="muted">${n} 个监控</span>
    </div>`).join('');
}

/* ============================================================
   交互：增删房间（本地 mock，演示用）
   ============================================================ */
function addRoom(platform,id,name){
  if(!id||!name) return alert('ID 与名称不能为空');
  if(data.rooms.some(r=>r.id===id)) return alert('该 ID 已存在');
  data.rooms.push({ platform, id, name, enabled:true, live:false, online:0 });
  renderLive(); renderDashboard();
}
function removeRoom(id){
  data.rooms = data.rooms.filter(r=>r.id!==id);
  renderLive(); renderDashboard();
}

/* ============================================================
   视图切换 + 事件绑定
   ============================================================ */
function switchView(view){
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+view).classList.add('active');
  $$('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
}

document.addEventListener('DOMContentLoaded', ()=>{
  // 首次渲染
  renderLive(); renderPosts(); renderLog(); renderDashboard();

  // tabbar 切换
  $('#tabbar').addEventListener('click', e=>{
    const t = e.target.closest('.tab'); if(t) switchView(t.dataset.view);
  });

  // 事件委托：列表内按钮
  document.addEventListener('click', e=>{
    const a = e.target.closest('[data-action]');
    if(a){
      const id = a.dataset.id;
      switch(a.dataset.action){
        case 'remove-room': removeRoom(id); break;
        case 'view-room':   alert('查看房间详情（演示）'); break;
        case 'edit-room':   alert('编辑房间（演示）'); break;
        case 'remove-post': data.post_rooms=data.post_rooms.filter(r=>r.id!==id); renderPosts(); renderDashboard(); break;
        case 'view-post':   alert('查看作品（演示）'); break;
        case 'edit-post':   alert('编辑账号（演示）'); break;
        case 'more': {
          const menu = a.parentElement.querySelector('.menu');
          const open = menu.classList.contains('open');
          $$('.menu').forEach(m=>m.classList.remove('open'));
          if(!open) menu.classList.add('open');
          e.stopPropagation(); return;
        }
      }
      $$('.menu').forEach(m=>m.classList.remove('open'));
      return;
    }
    // 点击空白处关闭菜单
    if(!e.target.closest('.more-wrap')) $$('.menu').forEach(m=>m.classList.remove('open'));
  });

  // live 添加表单显隐
  $('#toggle-add-form').addEventListener('click', ()=>{
    $('#live-add-form').classList.toggle('hidden');
  });
  $('#af-cancel').addEventListener('click', ()=>$('#live-add-form').classList.add('hidden'));
  $('#af-submit').addEventListener('click', ()=>{
    addRoom($('#af-platform').value, $('#af-id').value.trim(), $('#af-name').value.trim());
    $('#af-id').value=''; $('#af-name').value='';
    $('#live-add-form').classList.add('hidden');
  });

  // config 添加房间
  $('#cfg-add-room').addEventListener('click', ()=>{
    addRoom($('#cfg-platform').value, $('#cfg-id').value.trim(), $('#cfg-name').value.trim());
    $('#cfg-id').value=''; $('#cfg-name').value='';
  });
  $('#cfg-save-token').addEventListener('click', ()=>{
    alert('Token 已保存到本地（演示）');
  });

  // posts 全选
  $('#select-all').addEventListener('change', e=>{
    $$('.post-check').forEach(c=>c.checked = e.target.checked);
  });
  $('#batch-manage').addEventListener('click', ()=>{
    const n = $$('.post-check').filter(c=>c.checked).length;
    alert(n? `已选中 ${n} 个账号进行批量管理` : '请先选择账号');
  });
});
</script>
</body>
</html>
