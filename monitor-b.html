<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Live Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111827;
  --card:#1F2937;
  --card-hover:#263245;
  --text:#F9FAFB;
  --text2:#9CA3AF;
  --text3:#6B7280;
  --live:#22C55E;
  --live-glow:rgba(34,197,94,.25);
  --offline:#6B7280;
  --blue:#3B82F6;
  --red:#EF4444;
  --orange:#F59E0B;
  --bili:#00A1D6;
  --douyin:#FE2C55;
  --radius:20px;
  --radius-sm:14px;
  --gap:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC',sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + var(--safe-bottom));
}
.app{max-width:480px;margin:0 auto;padding:0 16px;padding-top:calc(16px + var(--safe-top))}

/* Header */
.header{text-align:center;padding:8px 0 20px;opacity:0;animation:fadeUp .4s ease-out .05s forwards}
.header-title{font-size:17px;font-weight:600;letter-spacing:.3px}
.header-time{font-size:13px;color:var(--text2);margin-top:2px}
.header-status{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--live);margin-top:6px;background:rgba(34,197,94,.1);padding:4px 12px;border-radius:20px}
.header-status .dot{width:6px;height:6px;border-radius:50%;background:var(--live);animation:breathe 2.5s ease-in-out infinite}
.header-status.err{color:var(--red);background:rgba(239,68,68,.1)}
.header-status.err .dot{background:var(--red);animation:none}
.header-status.warn{color:var(--orange);background:rgba(245,158,11,.1)}
.header-status.warn .dot{background:var(--orange);animation:none}

/* Section */
.section{margin-bottom:24px;opacity:0;animation:fadeUp .4s ease-out forwards}
.section:nth-child(2){animation-delay:.1s}
.section:nth-child(3){animation-delay:.15s}
.section:nth-child(4){animation-delay:.2s}
.section:nth-child(5){animation-delay:.25s}
.section:nth-child(6){animation-delay:.3s}
.section:nth-child(7){animation-delay:.35s}
.section-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-left:4px}

/* Overview */
.overview{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.ov-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;position:relative;overflow:hidden}
.ov-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,255,255,.06)}
.ov-num{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.ov-num.live{color:var(--live)}
.ov-num.off{color:var(--text2)}
.ov-num.push{color:var(--blue)}
.ov-num.dur{color:var(--text)}
.ov-label{font-size:13px;color:var(--text2);margin-top:4px;font-weight:500}

/* Room Cards */
.rooms{display:flex;flex-direction:column;gap:var(--gap)}
.room-card{background:var(--card);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:background .2s;border:1.5px solid transparent}
.room-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,255,255,.06)}
.room-card.live{border-color:rgba(34,197,94,.3);box-shadow:0 0 20px rgba(34,197,94,.08)}
.room-card.live::after{content:'';position:absolute;inset:0;border-radius:var(--radius);box-shadow:inset 0 0 30px rgba(34,197,94,.06);animation:cardBreathe 2.5s ease-in-out infinite;pointer-events:none}
.room-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--text2)}
.room-avatar.bili{background:linear-gradient(135deg,rgba(0,161,214,.2),rgba(0,161,214,.05))}
.room-avatar.douyin{background:linear-gradient(135deg,rgba(254,44,85,.2),rgba(254,44,85,.05))}
.room-info{flex:1;min-width:0}
.room-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--text2);flex-wrap:wrap}
.room-platform{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.room-platform.bili{color:var(--bili);background:rgba(0,161,214,.12)}
.room-platform.douyin{color:var(--douyin);background:rgba(254,44,85,.12)}
.room-status{font-size:13px;font-weight:500}
.room-status.live{color:var(--live)}
.room-status.off{color:var(--text3)}
.room-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.room-status.live .dot{background:var(--live);animation:breathe 2.5s ease-in-out infinite}
.room-status.off .dot{background:var(--text3)}
.room-online{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.room-time{font-size:12px;color:var(--text3)}
.room-link{color:var(--blue);font-size:13px;font-weight:500;text-decoration:none;padding:6px 0;flex-shrink:0}
.room-link:active{opacity:.6}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.08);border-radius:1px}
.tl-item{position:relative;padding-bottom:16px;animation:fadeUp .3s ease-out both}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--card);z-index:1}
.tl-dot.live{background:var(--live);box-shadow:0 0 8px rgba(34,197,94,.4)}
.tl-dot.off{background:var(--text3)}
.tl-dot.push{background:var(--blue)}
.tl-dot.err{background:var(--red)}
.tl-time{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;font-weight:500}
.tl-content{font-size:14px;margin-top:2px}
.tl-name{font-weight:600;color:var(--text)}
.tl-msg{color:var(--text2);font-size:13px}
.tl-day{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;margin-top:4px;padding-left:0}

/* Charts */
.chart-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;position:relative;overflow:hidden;margin-bottom:var(--gap)}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:rgba(255,255,255,.06)}
.chart-title{font-size:13px;color:var(--text2);font-weight:500;margin-bottom:12px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:80px}
.chart-bar{flex:1;border-radius:6px 6px 2px 2px;min-height:4px;transition:height .5s ease;background:var(--blue);opacity:.8}
.chart-bar:first-child{opacity:.4}
.chart-bar.today{opacity:1;background:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.3)}
.chart-labels{display:flex;gap:8px;margin-top:6px}
.chart-labels span{flex:1;text-align:center;font-size:10px;color:var(--text3)}

/* System Status */
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.sys-card{background:var(--card);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:center;gap:10px}
.sys-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sys-icon.ok{background:rgba(34,197,94,.12);color:var(--live)}
.sys-icon.err{background:rgba(239,68,68,.12);color:var(--red)}
.sys-name{font-size:13px;font-weight:600}
.sys-desc{font-size:11px;color:var(--text3);margin-top:1px}

/* Logs */
.log-toggle{width:100%;background:var(--card);border:none;border-radius:var(--radius-sm);padding:14px 16px;color:var(--text2);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:inherit;transition:background .2s}
.log-toggle:active{background:var(--card-hover)}
.log-toggle .arrow{transition:transform .25s;font-size:12px}
.log-toggle.open .arrow{transform:rotate(180deg)}
.log-panel{max-height:0;overflow:hidden;transition:max-height .35s ease}
.log-panel.open{max-height:400px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.log-list{padding:4px 0 8px}
.log-item{display:flex;gap:10px;padding:8px 4px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}
.log-item:last-child{border-bottom:none}
.log-t{color:var(--text3);font-variant-numeric:tabular-nums;flex-shrink:0;width:50px;font-size:12px;padding-top:1px}
.log-msg{color:var(--text2);flex:1;word-break:break-all}
.log-item.ok .log-msg{color:var(--live)}
.log-item.err .log-msg{color:var(--red)}

/* Bottom Nav */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(17,24,39,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);padding:6px 0 calc(6px + var(--safe-bottom));z-index:100;display:flex;justify-content:center}
.tabbar-inner{display:flex;max-width:480px;width:100%;padding:0 8px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text3);text-decoration:none;transition:color .2s;cursor:pointer;border:none;background:none;font-family:inherit}
.tab-item.active{color:var(--blue)}
.tab-icon{font-size:22px;line-height:1}
.tab-label{font-size:10px;font-weight:600;letter-spacing:.2px}

/* Tab content */
.tab-pane{display:none}
.tab-pane.active{display:block}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes cardBreathe{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes numberRoll{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

/* Scrollbar */
.log-panel::-webkit-scrollbar{width:3px}
.log-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* Pull to refresh */
.refresh-indicator{text-align:center;padding:8px;color:var(--text3);font-size:12px;display:none}
.refresh-indicator.show{display:block}

/* Empty state */
.empty{text-align:center;padding:30px 20px;color:var(--text3);font-size:14px}

/* Responsive */
@media(min-width:500px){
  .app{padding:0 20px;padding-top:calc(20px + var(--safe-top))}
  .overview{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header" id="header">
    <div class="header-title">📡 Live Monitor</div>
    <div class="header-time" id="headerTime">加载中…</div>
    <div class="header-status" id="headerStatus">
      <span class="dot"></span><span id="statusText">检测中</span>
    </div>
  </div>

  <!-- HOME TAB -->
  <div class="tab-pane active" id="tab-home">
    <div class="section">
      <div class="section-title">今日概览</div>
      <div class="overview">
        <div class="ov-card"><div class="ov-num live" id="ovLive">0</div><div class="ov-label">在线主播</div></div>
        <div class="ov-card"><div class="ov-num off" id="ovOff">0</div><div class="ov-label">离线主播</div></div>
        <div class="ov-card"><div class="ov-num push" id="ovPush">0</div><div class="ov-label">今日推送</div></div>
        <div class="ov-card"><div class="ov-num dur" id="ovDur">0m</div><div class="ov-label">总直播时长</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">主播状态</div>
      <div class="rooms" id="roomList"></div>
    </div>
  </div>

  <!-- STATS TAB -->
  <div class="tab-pane" id="tab-stats">
    <div class="section">
      <div class="section-title">过去七天</div>
      <div class="chart-card">
        <div class="chart-title">直播时长（小时）</div>
        <div class="chart-bars" id="durChart"></div>
        <div class="chart-labels" id="durLabels"></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">推送次数</div>
        <div class="chart-bars" id="pushChart"></div>
        <div class="chart-labels" id="pushLabels"></div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div class="tab-pane" id="tab-history">
    <div class="section">
      <div class="section-title">最近动态</div>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div class="tab-pane" id="tab-settings">
    <div class="section">
      <div class="section-title">系统状态</div>
      <div class="sys-grid" id="sysStatus">
        <div class="sys-card"><div class="sys-icon ok">●</div><div><div class="sys-name">GitHub</div><div class="sys-desc">Pages 正常</div></div></div>
        <div class="sys-card"><div class="sys-icon ok">●</div><div><div class="sys-name">B站API</div><div class="sys-desc">检测中</div></div></div>
        <div class="sys-card"><div class="sys-icon ok">●</div><div><div class="sys-name">抖音API</div><div class="sys-desc">检测中</div></div></div>
        <div class="sys-card"><div class="sys-icon ok">●</div><div><div class="sys-name">推送通道</div><div class="sys-desc">检测中</div></div></div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">日志</div>
      <button class="log-toggle" id="logToggle" onclick="toggleLogs()">
        系统日志 <span class="arrow">▼</span>
      </button>
      <div class="log-panel" id="logPanel">
        <div class="log-list" id="logList"></div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-item active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-icon">🏠</span><span class="tab-label">首页</span>
    </button>
    <button class="tab-item" data-tab="stats" onclick="switchTab('stats')">
      <span class="tab-icon">📊</span><span class="tab-label">统计</span>
    </button>
    <button class="tab-item" data-tab="history" onclick="switchTab('history')">
      <span class="tab-icon">🕐</span><span class="tab-label">动态</span>
    </button>
    <button class="tab-item" data-tab="settings" onclick="switchTab('settings')">
      <span class="tab-icon">⚙️</span><span class="tab-label">设置</span>
    </button>
  </div>
</div>

<script>
const CACHE={};
const PLATFORM_LABEL={bilibili:'B站',douyin:'抖音'};
const ROOM_URL={bilibili:id=>`https://live.bilibili.com/${id}`,douyin:id=>`https://live.douyin.com/${id}`};
const PLATFORM_ICON={bilibili:'📺',douyin:'🎵'};

let stat=null,historyData=[],rooms=[];

function switchTab(name){
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelector(`.tab-item[data-tab="${name}"]`).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function animateNum(el,from,to,dur=600){
  const start=performance.now();
  const isFloat=String(to).includes('.');
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const ease=1-Math.pow(1-t,3);
    const v=from+(to-from)*ease;
    el.textContent=isFloat?v.toFixed(1):Math.round(v).toLocaleString();
    if(t<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function fmtDur(sec){
  if(!sec||sec<60)return Math.round(sec/60)+'m';
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);
  if(h>0)return h+'h'+(m>0?m+'m':'');
  return m+'m';
}

function fmtTime(str){
  if(!str)return'';
  const d=new Date(str.replace(/-/g,'/'));
  const now=new Date();
  const diff=(now-d)/1000;
  if(diff<0)return'刚刚';
  if(diff<60)return'刚刚';
  if(diff<3600)return Math.floor(diff/60)+'分钟前';
  if(diff<86400)return Math.floor(diff/3600)+'小时前';
  const days=Math.floor(diff/86400);
  if(days===1)return'昨天';
  if(days<7)return days+'天前';
  return (d.getMonth()+1)+'/'+d.getDate();
}

function fmtClockTime(str){
  if(!str)return'';
  const d=new Date(str.replace(/-/g,'/'));
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

function initials(name){
  if(!name)return'?';
  return name[0].toUpperCase();
}

function getAvatar(r){
  if(r.avatar)return`<img class="room-avatar ${r.platform}" src="${r.avatar}" alt="" onerror="this.outerHTML='<div class=&quot;room-avatar ${r.platform}&quot;>${initials(r.name)}</div>'">`;
  return`<div class="room-avatar ${r.platform}">${initials(r.name)}</div>`;
}

function renderHeader(){
  if(!stat)return;
  const el=document.getElementById('headerTime');
  el.textContent=fmtTime(stat.updated)+' 更新';
  const statusEl=document.getElementById('headerStatus');
  const liveCount=stat.rooms.filter(r=>r.status==='live').length;
  const errCount=stat.rooms.filter(r=>r.status==='error').length;
  const textEl=document.getElementById('statusText');
  statusEl.className='header-status';
  if(errCount>0){statusEl.classList.add('warn');textEl.textContent=errCount+'个房间检测异常'}
  else if(liveCount>0){textEl.textContent=liveCount+'个主播在线'}
  else{textEl.textContent='所有主播离线'}
}

function renderOverview(){
  if(!stat)return;
  const rooms_list=stat.rooms;
  const live=rooms_list.filter(r=>r.status==='live');
  const off=rooms_list.filter(r=>r.status!=='live');
  const today=new Date();today.setHours(0,0,0,0);
  const pushes=historyData.filter(h=>h.push==='pushed_ok'&&new Date(h.time.replace(/-/g,'/'))>=today).length;
  let totalSec=0;
  rooms_list.forEach(r=>{
    if(r.status==='live'&&r.live_duration){
      const parts=r.live_duration.split(':');
      if(parts.length===3)totalSec+=+parts[0]*3600+ +parts[1]*60+ +parts[2];
    }
    if(r.last_live&&r.status==='offline'){
      const ld=new Date(r.last_live.replace(/-/g,'/'));
      if(ld>=today){
        const now=new Date(stat.updated.replace(/-/g,'/'));
        totalSec+=Math.max(0,(now-ld)/1000);
      }
    }
  });
  animateNum(document.getElementById('ovLive'),+document.getElementById('ovLive').textContent||0,live.length);
  animateNum(document.getElementById('ovOff'),+document.getElementById('ovOff').textContent||0,off.length);
  animateNum(document.getElementById('ovPush'),+document.getElementById('ovPush').textContent||0,pushes);
  document.getElementById('ovDur').textContent=fmtDur(totalSec);
}

function renderRooms(){
  if(!stat)return;
  const el=document.getElementById('roomList');
  const liveRooms=stat.rooms.filter(r=>r.status==='live'||r.status==='replay');
  const offRooms=stat.rooms.filter(r=>r.status!=='live'&&r.status!=='replay');
  const sorted=[...liveRooms,...offRooms];
  el.innerHTML=sorted.map(r=>{
    const isLive=r.status==='live';
    const url=ROOM_URL[r.platform]?ROOM_URL[r.platform](r.id):'#';
    const online=r.online&&isLive?`<span class="room-online">${r.online.toLocaleString()}人</span>`:'';
    const statusText=isLive?'在线':(r.status==='error'?'异常':'离线');
    const liveStart=r.live_duration?`<span class="room-time">已播 ${r.live_duration}</span>`:(r.last_live&&!isLive?`<span class="room-time">上次 ${fmtTime(r.last_live)}</span>`:'');
    const title=r.title&&isLive?`<div style="font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">${r.title}</div>`:'';
    return`
      <div class="room-card ${isLive?'live':''}">
        ${getAvatar(r)}
        <div class="room-info">
          <div class="room-name">${r.name}</div>
          <div class="room-meta">
            <span class="room-platform ${r.platform}">${PLATFORM_LABEL[r.platform]||r.platform}</span>
            <span class="room-status ${isLive?'live':'off'}"><span class="dot"></span>${statusText}</span>
            ${online}
          </div>
          ${title}
          ${!isLive&&r.last_live?`<div style="font-size:12px;color:var(--text3);margin-top:2px">上次 ${fmtTime(r.last_live)}</div>`:''}
          ${isLive&&r.live_duration?`<div style="font-size:12px;color:var(--text3);margin-top:2px">已播 ${r.live_duration}</div>`:''}
        </div>
        ${url!=='#'?`<a class="room-link" href="${url}" target="_blank" rel="noopener">观看 →</a>`:''}
      </div>`;
  }).join('');
}

function renderTimeline(){
  const el=document.getElementById('timeline');
  const events=historyData.filter(h=>{
    if(h.changed===true)return true;
    if(h.push==='pushed_ok'||h.push==='pushed_fail')return true;
    if(h.type==='error')return true;
    return false;
  }).slice(-50).reverse();
  if(!events.length){el.innerHTML='<div class="empty">暂无动态</div>';return}
  let html='';
  let lastDay='';
  events.forEach(e=>{
    const d=new Date(e.time.replace(/-/g,'/'));
    const dayKey=(d.getMonth()+1)+'/'+d.getDate();
    const today=new Date();today.setHours(0,0,0,0);
    const yest=new Date(today);yest.setDate(yest.getDate()-1);
    let dayLabel=dayKey;
    if(d>=today)dayLabel='今天';
    else if(d>=yest)dayLabel='昨天';
    if(dayLabel!==lastDay){
      html+=`<div class="tl-day">${dayLabel}</div>`;
      lastDay=dayLabel;
    }
    let dotClass='off',msg='';
    if(e.type==='live_on'){dotClass='live';msg=`开始直播`}
    else if(e.type==='live_off'){dotClass='off';msg=`结束直播`}
    else if(e.push==='pushed_ok'){dotClass='push';msg=`推送成功`}
    else if(e.push==='pushed_fail'){dotClass='err';msg=`推送失败`}
    else if(e.type==='error'){dotClass='err';msg=e.detail||'检测异常'}
    else{dotClass='off';msg=e.title||e.status||'状态更新'}
    html+=`<div class="tl-item">
      <div class="tl-dot ${dotClass}"></div>
      <div class="tl-time">${fmtClockTime(e.time)}</div>
      <div class="tl-content"><span class="tl-name">${e.name}</span> <span class="tl-msg">${msg}</span></div>
    </div>`;
  });
  el.innerHTML=html;
}

function renderCharts(){
  const days=[];
  const durData=[];
  const pushData=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);
    const dEnd=new Date(d);dEnd.setHours(23,59,59,999);
    days.push(i===0?'今':String(d.getMonth()+1)+'/'+d.getDate());
    let sec=0;
    const dayEvents=historyData.filter(h=>new Date(h.time.replace(/-/g,'/'))>=d&&new Date(h.time.replace(/-/g,'/'))<=dEnd);
    const liveOn={};
    dayEvents.forEach(e=>{
      if(e.type==='live_on')liveOn[e.account]=new Date(e.time.replace(/-/g,'/'));
      else if(e.type==='live_off'&&liveOn[e.account]){
        sec+=(new Date(e.time.replace(/-/g,'/'))-liveOn[e.account])/1000;
        delete liveOn[e.account];
      }
    });
    durData.push(Math.round(sec/3600*10)/10);
    pushData.push(dayEvents.filter(h=>h.push==='pushed_ok').length);
  }
  function renderBars(containerId,labelId,data,color){
    const max=Math.max(...data,1);
    document.getElementById(containerId).innerHTML=data.map((v,i)=>{
      const pct=Math.max(4,(v/max)*100);
      return`<div class="chart-bar ${i===6?'today':''}" style="height:${pct}%" title="${v}"></div>`;
    }).join('');
    document.getElementById(labelId).innerHTML=days.map(d=>`<span>${d}</span>`).join('');
  }
  renderBars('durChart','durLabels',durData);
  renderBars('pushChart','pushLabels',pushData);
}

function renderSysStatus(){
  const errCount=stat?stat.rooms.filter(r=>r.status==='error').length:0;
  const hasPushErr=historyData.slice(0,20).some(h=>h.push==='pushed_fail'||h.push==='push_error');
  const cards=document.querySelectorAll('.sys-card');
  const sysData=[
    {ok:true,name:'GitHub',desc:'Pages 正常'},
    {ok:errCount===0,name:'B站 API',desc:errCount?'部分异常':'正常'},
    {ok:errCount===0,name:'抖音 API',desc:errCount?'部分异常':'正常'},
    {ok:!hasPushErr,name:'推送通道',desc:hasPushErr?'可能异常':'正常'},
  ];
  sysData.forEach((s,i)=>{
    if(cards[i]){
      const icon=cards[i].querySelector('.sys-icon');
      icon.className='sys-icon '+(s.ok?'ok':'err');
      icon.textContent=s.ok?'✓':'!';
      cards[i].querySelector('.sys-name').textContent=s.name;
      cards[i].querySelector('.sys-desc').textContent=s.desc;
    }
  });
}

function renderLogs(){
  const el=document.getElementById('logList');
  const recent=historyData.filter(h=>h.changed===true||h.push||h.type==='error').slice(-40).reverse();
  if(!recent.length){el.innerHTML='<div style="padding:12px 4px;color:var(--text3);font-size:13px">暂无日志</div>';return}
  el.innerHTML=recent.map(e=>{
    let cls='',msg='';
    if(e.push==='pushed_ok'){cls='ok';msg=`${e.name} 推送成功`}
    else if(e.type==='error'||e.push==='pushed_fail'){cls='err';msg=e.detail||`${e.name} ${e.title||'异常'}`}
    else if(e.type==='live_on'){msg=`${e.name} 开播`}
    else if(e.type==='live_off'){msg=`${e.name} 离线`}
    else if(e.type==='replay'){msg=`${e.name} 回放`}
    else{msg=`${e.name} ${e.status}`}
    return`<div class="log-item ${cls}"><span class="log-t">${fmtClockTime(e.time)}</span><span class="log-msg">${msg}</span></div>`;
  }).join('');
}

function toggleLogs(){
  const btn=document.getElementById('logToggle');
  const panel=document.getElementById('logPanel');
  btn.classList.toggle('open');
  panel.classList.toggle('open');
}

async function loadJSON(url){
  try{
    const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    return await r.json();
  }catch(e){return null}
}

async function refresh(){
  const [s,h]=await Promise.all([
    loadJSON('status.json'),
    loadJSON('history.json')
  ]);
  if(s){
    stat=s;
    CACHE.stat=s;
  }else if(CACHE.stat){
    stat=CACHE.stat;
  }
  if(h){historyData=h;CACHE.history=h}
  else if(CACHE.history){historyData=CACHE.history}
  rooms=await loadJSON('rooms.json')||rooms;

  renderHeader();
  renderOverview();
  renderRooms();
  renderTimeline();
  renderCharts();
  renderSysStatus();
  renderLogs();
}

let refreshTimer;
function scheduleRefresh(){
  clearInterval(refreshTimer);
  refreshTimer=setInterval(refresh,30000);
}

document.addEventListener('DOMContentLoaded',()=>{
  refresh();
  scheduleRefresh();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
});
</script>
