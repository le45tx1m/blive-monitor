name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ip_suffix: ["57", "69", "119", "177"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Test IP 103.102.202.${{ matrix.ip_suffix }}
        run: |
          echo "103.102.202.${{ matrix.ip_suffix }} live.kuaishou.com" | sudo tee -a /etc/hosts
          # www 也用中国 CDN
          echo "103.102.202.106 www.kuaishou.com" | sudo tee -a /etc/hosts
          curl -s -o /dev/null -w "live -> %{remote_ip} (%{time_total}s)\n" https://live.kuaishou.com/

          python3 << 'PYEOF'
          import json, time
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN", user_agent=UA)
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  ctx.add_cookies(cache["cookies"])
              except: pass

              page = ctx.new_page()
              api_results = []
              def on_resp(resp):
                  if "live_api/profile/public" in resp.url:
                      try:
                          d = json.loads(resp.body().decode("utf-8","replace"))
                          data = d.get("data", {})
                          lst = data.get("list", [])
                          print(f"  API: result={data.get('result')}, list={len(lst)}, pcursor={data.get('pcursor')}")
                          if lst:
                              # 从 poster URL 提取日期
                              poster = lst[0].get("poster", "")
                              print(f"  first poster: {poster[:100]}")
                          api_results.append(data)
                      except: pass
              page.on("response", on_resp)

              # 预热
              print("Warming up...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=15000)
                  page.wait_for_timeout(6000)
              except: pass

              # 多次导航测试
              for nav in range(3):
                  print(f"\nNavigation {nav+1}:")
                  page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)

              # 汇总
              print(f"\n=== SUMMARY ===")
              for i, r in enumerate(api_results):
                  print(f"  Call {i+1}: result={r.get('result')}, list={len(r.get('list',[]))}, pcursor={r.get('pcursor')}")

              browser.close()
          PYEOF
