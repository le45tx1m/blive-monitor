name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          patchright install --with-deps chromium
      - name: Full session test with Chinese CDN
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          # 写中国 CDN IP 到 hosts
          python3 << 'PYINIT'
          import socket, struct, random, subprocess
          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips
          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              print(f"{domain} -> {ip} (all: {ips})")
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
          print("Hosts written")
          PYINIT

          python3 << 'PYEOF'
          import json, logging, urllib.request
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
          print(f"Runner exit IP: {ip}")

          from patchright.sync_api import sync_playwright
          from backend.adapters.kuaishou_feed import KuaishouFeedSession

          accounts = [
              ("3xrgxqkqp829xz6", "Sandy88888"),
          ]

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  ctx.add_cookies(cache["cookies"])
              except: pass

              session = KuaishouFeedSession(ctx, "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")

              for pid, name in accounts:
                  print(f"\n{'='*60}")
                  print(f"Testing {name} (pid={pid})")
                  result = session.fetch(pid)
                  print(f"ok={result.get('ok')} result={result.get('result')} items={len(result.get('items',[]))}")
                  print(f"living={result.get('living')}")
                  items = result.get("items", [])
                  for i, item in enumerate(items[:10]):
                      print(f"  [{i}] photo_id={item.get('photo_id')} ts={item.get('timestamp')} author={item.get('author_name')} is_image={item.get('is_image')}")
                  print(f"seen: {result.get('seen')}")

              browser.close()
          PYEOF
