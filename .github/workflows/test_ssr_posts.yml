name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Alternative subdomain/host test
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess, re, ssl, urllib.request
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          # 解析各种快手子域名
          print("=== Kuaishou subdomain resolution ===")
          subdomains = ["live.kuaishou.com", "www.kuaishou.com", "api.kuaishou.com",
                       "cp.kuaishou.com", "v.kuaishou.com", "m.kuaishou.com",
                       "open.kuaishou.com", "static.kuaishou.com", "js.kuaishou.com"]
          cn_ips = {}
          for sub in subdomains:
              try:
                  ips = dns(sub)
                  cn_ips[sub] = ips
                  print(f"  {sub}: {ips[:3]}")
              except Exception as e:
                  print(f"  {sub}: ERROR {e}")

          # 用中国 CDN IP 映射 live 和 www
          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)

          # 直接用 urllib 测试不同 Host 头
          print("\n=== Direct HTTP with different Host headers ===")
          cn_ip = dns("live.kuaishou.com")[0]
          paths = [
              f"/live_api/profile/public?principalId={PID}&count=12&privacy=public&caver=2&hasMore=false",
              f"/live_api/profile/public?principalId={PID}&count=12&privacy=public&caver=2",
          ]
          hosts = ["live.kuaishou.com", "www.kuaishou.com", "api.kuaishou.com"]
          for host in hosts:
              for path in paths[:1]:
                  try:
                      ctx = ssl.create_default_context()
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                      sock = socket.create_connection((cn_ip, 443), timeout=10)
                      ssock = ctx.wrap_socket(sock, server_hostname="live.kuaishou.com")
                      req = f"GET {path} HTTP/1.1\r\nHost: {host}\r\nUser-Agent: {UA}\r\nReferer: https://live.kuaishou.com/\r\nAccept: application/json\r\nConnection: close\r\n\r\n"
                      ssock.sendall(req.encode())
                      resp = b""
                      while True:
                          try:
                              chunk = ssock.recv(4096)
                              if not chunk: break
                              resp += chunk
                          except: break
                      ssock.close()
                      text = resp.decode("utf-8", "replace")
                      if "\r\n\r\n" in text:
                          headers, body = text.split("\r\n\r\n", 1)
                          status = headers.split("\r\n")[0]
                          try:
                              d = json.loads(body)
                              data = d.get("data", d)
                              print(f"  Host={host}: {status} result={data.get('result')} list={len(data.get('list',[]))}")
                          except:
                              print(f"  Host={host}: {status} body={body[:100]}")
                  except Exception as e:
                      print(f"  Host={host}: ERROR {str(e)[:80]}")

          # 用浏览器测试：route 到不同子域名
          print("\n=== Browser: route API to different subdomains ===")
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage","--ignore-certificate-errors"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  timezone_id="Asia/Shanghai", user_agent=UA, ignore_https_errors=True)
              page = ctx.new_page()

              # 预热
              print("Warming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)
              except Exception as e:
                  print(f"Warmup: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 拦截 API 请求，转发到不同 host
              for alt_host in ["www.kuaishou.com"]:
                  print(f"\n--- Routing live_api to {alt_host} ---")
                  def make_router(host):
                      def router(route, request):
                          if "live_api/profile/public" in request.url:
                              new_url = request.url.replace("https://live.kuaishou.com/", f"https://{host}/")
                              print(f"  Route: {request.url[:80]} -> {new_url[:80]}")
                              route.continue_(url=new_url)
                          else:
                              route.continue_()
                      return router
                  page.route("**/live_api/profile/public*", make_router(alt_host))
                  
                  results = []
                  def on_resp(resp):
                      if "profile/public" in resp.url or "profile/feed" in resp.url:
                          try:
                              d = json.loads(resp.body().decode("utf-8","replace"))
                              data = d.get("data", d)
                              lst = data.get("list", data.get("feeds", []))
                              print(f"  {resp.url[:80]}: result={data.get('result')} list={len(lst) if isinstance(lst, list) else 'N/A'}")
                              results.append(data)
                          except: pass
                  page.on("response", on_resp)
                  
                  page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(12000)
                  
                  page.remove_listener("response", on_resp)
                  page.unroute("**/live_api/profile/public*")

              browser.close()
          PYEOF
