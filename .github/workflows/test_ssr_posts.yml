name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        id: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Check IP
        run: |
          curl -s https://api.ipify.org && echo ""
          curl -s https://ipinfo.io/json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'IP: {d.get(\"ip\")}, City: {d.get(\"city\")}, Region: {d.get(\"region\")}, Country: {d.get(\"country\")}, Org: {d.get(\"org\")}')" 2>/dev/null || echo "ipinfo failed"
