name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          patchright install --with-deps chromium
      - name: Chinese CDN IP + browser test
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          python3 << 'PYEOF'
          import json, logging, subprocess, socket, struct, random, urllib.request
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          # 1. 用中国 DNS 解析
          def dns_query(name, server="223.5.5.5"):
              txid = random.randint(0, 65535)
              header = struct.pack(">HHHHHH", txid, 0x0100, 1, 0, 0, 0)
              question = b"".join(bytes([len(p)]) + p.encode() for p in name.split(".")) + b"\x00"
              question += struct.pack(">HH", 1, 1)
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(5)
              sock.sendto(header + question, (server, 53))
              data = sock.recv(512)
              sock.close()
              idx = 12
              while data[idx] != 0: idx += data[idx] + 1
              idx += 5
              ancount = struct.unpack(">H", data[6:8])[0]
              ips = []
              for _ in range(ancount):
                  if data[idx] & 0xC0 == 0xC0: idx += 2
                  else:
                      while data[idx] != 0: idx += data[idx] + 1
                      idx += 1
                  rtype, rclass, ttl, rdlen = struct.unpack(">HHIH", data[idx:idx+10])
                  idx += 10
                  if rtype == 1 and rdlen == 4:
                      ips.append(".".join(str(b) for b in data[idx:idx+4]))
                  idx += rdlen
              return ips

          live_ips = dns_query("live.kuaishou.com")
          www_ips = dns_query("www.kuaishou.com")
          print(f"live.kuaishou.com CN IPs: {live_ips}")
          print(f"www.kuaishou.com CN IPs: {www_ips}")

          # 2. 写入 /etc/hosts
          live_ip = live_ips[0]
          www_ip = www_ips[0]
          with open("/etc/hosts", "a") as f:
              f.write(f"\n{live_ip} live.kuaishou.com\n")
              f.write(f"{www_ip} www.kuaishou.com\n")
          print(f"Added to /etc/hosts: live.kuaishou.com -> {live_ip}, www.kuaishou.com -> {www_ip}")

          # 3. 验证 DNS 生效
          import subprocess
          result = subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "%{remote_ip}", "https://live.kuaishou.com/"], capture_output=True, text=True, timeout=10)
          print(f"curl live.kuaishou.com -> {result.stdout}")

          # 4. 检查本地出口 IP
          ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
          print(f"Runner exit IP: {ip}")

          # 5. 用浏览器测试
          from patchright.sync_api import sync_playwright
          from backend.adapters.kuaishou_feed import KuaishouFeedSession

          PID = "3xrgxqkqp829xz6"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  ctx.add_cookies(cache["cookies"])
              except: pass

              session = KuaishouFeedSession(ctx, "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              result = session.fetch(PID)
              print(f"\nok={result.get('ok')} result={result.get('result')} items={len(result.get('items',[]))}")
              for item in result.get("items", [])[:5]:
                  photo = item.get("photo", item) if isinstance(item, dict) else {}
                  print(f"  id={photo.get('id')} caption={str(photo.get('caption',''))[:60]}")
              print(f"seen: {result.get('seen')}")
              browser.close()
          PYEOF
