name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Comprehensive Chinese CDN test
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess, re
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
              print(f"{domain} -> {ip}")

          def log_api(label, data):
              lst = data.get("list", [])
              items = []
              for item in lst[:12]:
                  poster = item.get("poster", "")
                  dm = re.search(r'/(\d{4}/\d{2}/\d{2})/', poster)
                  items.append(f"{item.get('id')}({dm.group(1) if dm else '?'})")
              print(f"  [{label}] result={data.get('result')}, list={len(lst)}, pcursor={data.get('pcursor')}")
              print(f"  items: {items}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(
                  viewport={"width":1366,"height":900}, locale="zh-CN",
                  timezone_id="Asia/Shanghai",
                  geolocation={"latitude": 39.9075, "longitude": 116.3972},  # 北京
                  permissions=["geolocation"],
                  user_agent=UA)
              # 全新身份
              page = ctx.new_page()

              # 预热
              print("Warming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(10000)
              except Exception as e:
                  print(f"Warmup: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 测试 1: 原始请求（hasMore=true）
              print("\n=== Test 1: Original (hasMore=true) ===")
              results1 = []
              def on_resp1(resp):
                  if "live_api/profile/public" in resp.url:
                      try: results1.append(json.loads(resp.body().decode())["data"])
                      except: pass
              page.on("response", on_resp1)
              page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(12000)
              page.remove_listener("response", on_resp1)
              for r in results1: log_api("original", r)

              # 测试 2: 修改 hasMore=true -> false
              print("\n=== Test 2: hasMore=false ===")
              def modify_hasmore(route, request):
                  new_url = request.url.replace("hasMore=true", "hasMore=false")
                  route.continue_(url=new_url)
              page.route("**/live_api/profile/public*", modify_hasmore)
              results2 = []
              def on_resp2(resp):
                  if "live_api/profile/public" in resp.url:
                      try: results2.append(json.loads(resp.body().decode())["data"])
                      except: pass
              page.on("response", on_resp2)
              page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(12000)
              page.remove_listener("response", on_resp2)
              page.unroute("**/live_api/profile/public*")
              for r in results2: log_api("hasMore=false", r)

              # 测试 3: 移除 hasMore 参数
              print("\n=== Test 3: Remove hasMore ===")
              def remove_hasmore(route, request):
                  new_url = request.url.replace("&hasMore=true", "").replace("hasMore=true&", "")
                  route.continue_(url=new_url)
              page.route("**/live_api/profile/public*", remove_hasmore)
              results3 = []
              def on_resp3(resp):
                  if "live_api/profile/public" in resp.url:
                      try: results3.append(json.loads(resp.body().decode())["data"])
                      except: pass
              page.on("response", on_resp3)
              page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(12000)
              page.remove_listener("response", on_resp3)
              page.unroute("**/live_api/profile/public*")
              for r in results3: log_api("no-hasMore", r)

              # 测试 4: www.kuaishou.com/profile 页面
              print("\n=== Test 4: www.kuaishou.com profile ===")
              results4 = []
              def on_resp4(resp):
                  if "profile" in resp.url and ("graphql" in resp.url or "rest/" in resp.url or "live_api" in resp.url):
                      try:
                          body = resp.body().decode("utf-8","replace")
                          print(f"  URL: {resp.url[:120]}")
                          d = json.loads(body)
                          data = d.get("data", d)
                          if isinstance(data, dict):
                              if "result" in data:
                                  log_api("www-profile", data)
                              elif "visionProfilePhotoList" in data:
                                  vpl = data["visionProfilePhotoList"]
                                  if isinstance(vpl, dict):
                                      feeds = vpl.get("feeds", [])
                                      print(f"  visionProfilePhotoList feeds: {len(feeds)}")
                      except: pass
              page.on("response", on_resp4)
              try:
                  page.goto(f"https://www.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(10000)
              except Exception as e:
                  print(f"  www profile error: {e}")
              page.remove_listener("response", on_resp4)

              browser.close()
          PYEOF
