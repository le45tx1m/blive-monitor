name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Test /rest/v/profile/feed
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess, re
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          USER_ID = "2117550"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
              print(f"{domain} -> {ip}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(
                  viewport={"width":1366,"height":900}, locale="zh-CN",
                  timezone_id="Asia/Shanghai",
                  user_agent=UA)
              page = ctx.new_page()

              # 拦截所有 www/rest/ 请求
              def on_resp(resp):
                  url = resp.url
                  if "/rest/" in url and ("profile" in url or "feed" in url or "photo" in url):
                      try:
                          body = resp.body().decode("utf-8","replace")
                          print(f"\n=== {resp.request.method} {url[:150]} ===")
                          try:
                              d = json.loads(body)
                              print(f"  Top keys: {list(d.keys())[:10]}")
                              data = d.get("data", d)
                              if isinstance(data, dict):
                                  print(f"  data keys: {list(data.keys())[:15]}")
                                  # 找作品列表
                                  for key in ["feeds", "list", "photos", "works", "items", "records", "data"]:
                                      if key in data and isinstance(data[key], list):
                                          items = data[key]
                                          print(f"  {key}: {len(items)} items")
                                          for item in items[:5]:
                                              if isinstance(item, dict):
                                                  pid = item.get("id") or item.get("photoId") or item.get("photo_id")
                                                  ts = item.get("timestamp") or item.get("createTime") or item.get("date")
                                                  print(f"    id={pid} ts={ts}")
                                                  # 找封面图中的日期
                                                  for v in item.values():
                                                      if isinstance(v, str) and re.search(r'/(\d{4}/\d{2}/\d{2})/', v):
                                                          dm = re.search(r'/(\d{4}/\d{2}/\d{2})/', v)
                                                          print(f"      date from URL: {dm.group(1)}")
                                                          break
                                  if "result" in data:
                                      print(f"  result: {data['result']}")
                                  if "pcursor" in data:
                                      print(f"  pcursor: {data['pcursor']}")
                          except:
                              print(f"  Body: {body[:500]}")
                      except: pass
              page.on("response", on_resp)

              # 预热
              print("Warming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)
              except Exception as e:
                  print(f"Warmup: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 访问 www profile 页
              print(f"\nNavigating to www.kuaishou.com/profile/{PID}...")
              try:
                  page.goto(f"https://www.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(15000)
              except Exception as e:
                  print(f"Profile error: {e}")

              # 滚动加载更多
              print("\nScrolling...")
              for _ in range(3):
                  page.evaluate("window.scrollBy(0, 1000)")
                  page.wait_for_timeout(3000)

              browser.close()
          PYEOF
