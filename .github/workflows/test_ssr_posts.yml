name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Try header spoofing and JSONP
        run: |
          python3 << 'PYEOF'
          import urllib.request, json

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          PID = "3xrgxqkqp829xz6"
          BASE = f"https://live.kuaishou.com/live_api/profile/public?principalId={PID}&count=12&privacy=public"

          def try_req(label, url, headers=None):
              hdr = {"User-Agent": UA, "Referer": "https://live.kuaishou.com/"}
              if headers: hdr.update(headers)
              req = urllib.request.Request(url, headers=hdr)
              try:
                  r = urllib.request.urlopen(req, timeout=10)
                  body = r.read().decode("utf-8", "replace")
                  try:
                      d = json.loads(body)
                      data = d.get("data", d)
                      print(f"  {label}: result={data.get('result')}, list={len(data.get('list',[]))}")
                  except:
                      print(f"  {label}: {body[:150]}")
              except Exception as e:
                  print(f"  {label}: ERROR {str(e)[:100]}")

          # 1. X-Forwarded-For 欺骗
          print("=== X-Forwarded-For spoofing ===")
          for ip in ["1.2.3.4", "114.114.114.114", "223.5.5.5", "180.101.50.1"]:
              try_req(f"XFF={ip}", BASE, {"X-Forwarded-For": ip, "X-Real-IP": ip})

          # 2. JSONP
          print("\n=== JSONP ===")
          try_req("JSONP callback", BASE + "&callback=jQuery123")

          # 3. 不同的 Accept 头
          print("\n=== Different headers ===")
          try_req("Accept: */*", BASE, {"Accept": "*/*"})
          try_req("X-Requested-With", BASE, {"X-Requested-With": "XMLHttpRequest"})

          # 4. POST 方法
          print("\n=== POST method ===")
          req = urllib.request.Request(BASE, data=b"", headers={"User-Agent": UA, "Referer": "https://live.kuaishou.com/", "Content-Type": "application/x-www-form-urlencoded"})
          try:
              r = urllib.request.urlopen(req, timeout=10)
              body = r.read().decode()
              d = json.loads(body)
              print(f"  POST: result={d.get('data',{}).get('result')}")
          except Exception as e:
              print(f"  POST: {str(e)[:100]}")

          # 5. 带 did cookie 的裸请求
          print("\n=== With did cookie ===")
          try_req("did cookie", BASE, {"Cookie": "did=web_d6d698fea12a0722d654539cc323b3f5; kpf=PC_WEB; clientid=3; kpn=GAME_ZONE"})

          # 6. 检查 sitemap
          print("\n=== Sitemap ===")
          for sm in ["https://live.kuaishou.com/sitemap.xml", "https://www.kuaishou.com/sitemap.xml", "https://live.kuaishou.com/robots.txt"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(sm, headers={"User-Agent": UA}), timeout=10)
                  body = r.read().decode("utf-8", "replace")
                  print(f"  {sm}: {r.status} ({len(body)} bytes): {body[:200]}")
              except Exception as e:
                  print(f"  {sm}: {str(e)[:100]}")

          # 7. 搜索 API
          print("\n=== Search API ===")
          for surl in [
              "https://live.kuaishou.com/live_api/search/user?keyword=Sandy88888&count=12",
              "https://www.kuaishou.com/rest//search/user?keyword=Sandy88888",
              "https://live.kuaishou.com/live_api/search/feed?keyword=Sandy88888",
              "https://live.kuaishou.com/live_api/search?keyword=Sandy88888",
          ]:
              try_req(surl.split("/live_api/")[1][:50] if "/live_api/" in surl else surl.split("/")[-1][:50], surl)
          PYEOF
