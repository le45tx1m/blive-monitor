name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Mixed DNS test
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          # 只映射 www.kuaishou.com 到中国 CDN
          www_ips = dns('www.kuaishou.com')
          www_ip = next((x for x in www_ips if x.startswith('103.102.202.')), www_ips[0])
          subprocess.run(['sudo', 'bash', '-c', f'echo "{www_ip} www.kuaishou.com" >> /etc/hosts'], check=True)
          print(f"www.kuaishou.com -> {www_ip} (Chinese CDN for warmup)")
          print(f"live.kuaishou.com -> normal DNS (US edge for API)")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN", user_agent=UA)
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  ctx.add_cookies(cache["cookies"])
              except: pass

              page = ctx.new_page()
              api_results = []
              def on_resp(resp):
                  if "live_api/profile/public" in resp.url:
                      try:
                          body = resp.body().decode("utf-8","replace")
                          d = json.loads(body)
                          data = d.get("data", {})
                          lst = data.get("list", [])
                          pcursor = data.get("pcursor")
                          print(f"  API: result={data.get('result')}, list={len(lst)}, pcursor={pcursor}")
                          for item in lst[:3]:
                              print(f"    id={item.get('id')} poster={str(item.get('poster',''))[:80]}")
                          api_results.append(d)
                      except Exception as e:
                          print(f"  API error: {e}")
              page.on("response", on_resp)

              # 预热 www（中国 CDN）
              print("Warming up www.kuaishou.com (Chinese CDN)...")
              page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
              for w in range(10):
                  page.wait_for_timeout(1000)
                  cookies = {c["name"] for c in ctx.cookies()}
                  ab = cookies & {"kwfv1","kwssectoken","kwscode"}
                  if len(ab) == 3 and "did" in cookies:
                      print(f"  Warmup OK after {w+1}s: {sorted(ab)}")
                      break
              else:
                  print(f"  Warmup: {sorted(ab)}")

              # 现在访问 live profile（正常 DNS = US edge）
              print(f"\nNavigating to profile/{PID} (US edge)...")
              page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(15000)

              # 重试几次
              for attempt in range(3):
                  if api_results and api_results[-1].get("data",{}).get("result") == 1:
                      break
                  print(f"  Retry {attempt+1}...")
                  page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(10000)

              print(f"\n=== FINAL: {len(api_results)} API calls ===")
              browser.close()
          PYEOF
