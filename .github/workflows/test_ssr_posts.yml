name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: GraphQL on Chinese CDN
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          USER_ID = "2117550"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          # 两个域名都映射到中国 CDN
          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
              print(f"{domain} -> {ip}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN", user_agent=UA)
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  ctx.add_cookies(cache["cookies"])
              except: pass

              page = ctx.new_page()

              # 拦截所有 API 响应
              def on_resp(resp):
                  url = resp.url
                  if any(x in url for x in ["live_api", "graphql", "/rest/"]):
                      try:
                          body = resp.body().decode("utf-8","replace")
                          if "profile" in url.lower() or "photo" in url.lower() or "vision" in url.lower() or "feed" in url.lower():
                              print(f"\n=== {resp.request.method} {url[:150]} ===")
                              try:
                                  d = json.loads(body)
                                  print(f"  Keys: {list(d.keys())[:10]}")
                                  if "data" in d:
                                      dd = d["data"]
                                      if isinstance(dd, dict):
                                          print(f"  data keys: {list(dd.keys())[:10]}")
                                          if "result" in dd:
                                              print(f"  result: {dd['result']}, list: {len(dd.get('list',[]))}")
                                          if "visionProfilePhotoList" in dd:
                                              vpl = dd["visionProfilePhotoList"]
                                              print(f"  visionProfilePhotoList: {list(vpl.keys()) if isinstance(vpl, dict) else type(vpl)}")
                                              if isinstance(vpl, dict):
                                                  feeds = vpl.get("feeds", [])
                                                  print(f"  feeds count: {len(feeds)}")
                                                  for f in feeds[:3]:
                                                      print(f"    id={f.get('id')} timestamp={f.get('timestamp')}")
                              except:
                                  print(f"  Body: {body[:300]}")
                      except: pass
              page.on("response", on_resp)

              # 预热
              print("Warming up www...")
              page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
              page.wait_for_timeout(8000)
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"  Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 方法1: 直接在浏览器里用 fetch 调 GraphQL
              print("\n=== GraphQL visionProfilePhotoList via fetch ===")
              graphql_result = page.evaluate("""async (userId) => {
                  const resp = await fetch('https://www.kuaishou.com/graphql', {
                      method: 'POST',
                      headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({
                          operationName: "visionProfilePhotoList",
                          variables: {userId: userId, pcursor: "", count: 12},
                          query: `query visionProfilePhotoList($userId: String, $pcursor: String, $count: Int) {
                              visionProfilePhotoList(userId: $userId, pcursor: $pcursor, count: $count) {
                                  feeds { id timestamp caption photoUrl playUrl }
                                  pcursor
                              }
                          }`
                      })
                  });
                  return await resp.text();
              }""", USER_ID)
              try:
                  d = json.loads(graphql_result)
                  print(f"GraphQL response: {json.dumps(d, ensure_ascii=False)[:500]}")
              except:
                  print(f"GraphQL raw: {graphql_result[:500]}")

              # 方法2: 访问 www.kuaishou.com/profile 页面
              print("\n=== www.kuaishou.com profile page ===")
              page.goto(f"https://www.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=20000)
              page.wait_for_timeout(10000)

              # 方法3: 访问 live profile（中国 CDN）
              print("\n=== live.kuaishou.com profile (Chinese CDN) ===")
              page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=20000)
              page.wait_for_timeout(10000)

              browser.close()
          PYEOF
