name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Test alternative IPs
        run: |
          # 先测 v.kuaishou.com 的 IP
          echo "124.156.126.37 live.kuaishou.com" | sudo tee -a /etc/hosts
          echo "103.102.202.144 www.kuaishou.com" | sudo tee -a /etc/hosts
          curl -s -o /dev/null -w "live via 124.156.126.37: %{http_code} (%{time_total}s)\n" https://live.kuaishou.com/ 2>&1

          python3 << 'PYEOF'
          import json, time, re
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage","--ignore-certificate-errors"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  timezone_id="Asia/Shanghai", user_agent=UA, ignore_https_errors=True)
              page = ctx.new_page()

              api_results = []
              def on_resp(resp):
                  if "live_api/profile/public" in resp.url:
                      try:
                          d = json.loads(resp.body().decode("utf-8","replace"))
                          data = d.get("data", {})
                          lst = data.get("list", [])
                          items = []
                          for item in lst[:12]:
                              poster = item.get("poster", "")
                              dm = re.search(r'/(\d{4}/\d{2}/\d{2})/', poster)
                              items.append(f"{item.get('id')}({dm.group(1) if dm else '?'})")
                          print(f"  API: result={data.get('result')}, list={len(lst)}, pcursor={data.get('pcursor')}")
                          print(f"  items: {items}")
                          api_results.append(data)
                      except: pass
              page.on("response", on_resp)

              # 预热
              print("Warming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)
              except Exception as e:
                  print(f"Warmup: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 访问 profile (via 124.156.126.37)
              print(f"\nNavigating to profile via 124.156.126.37...")
              try:
                  page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(15000)
              except Exception as e:
                  print(f"Navigation error: {e}")

              if not api_results:
                  print("No API response, checking page content...")
                  try:
                      title = page.title()
                      url = page.url
                      print(f"Title: {title}, URL: {url}")
                  except: pass

              browser.close()
          PYEOF
