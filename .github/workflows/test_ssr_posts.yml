name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SSR profile page for posts
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re, sys

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          # 1. 检查出口 IP
          ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
          print(f"=== EXIT IP: {ip} ===")

          # 2. 抓取 profile SSR 页面
          url = f"https://live.kuaishou.com/profile/{PID}"
          req = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://live.kuaishou.com/"})
          try:
              html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", "replace")
              print(f"Profile page: {len(html)} bytes, status OK")
          except Exception as e:
              print(f"Profile page error: {e}")
              sys.exit(1)

          # 3. 提取 __INITIAL_STATE__
          m = re.search(r'window\.__INITIAL_STATE__\s*=\s*(\{.*?\});?\s*</script>', html, re.DOTALL)
          if not m:
              m = re.search(r'window\.__INITIAL_STATE__\s*=\s*(\{.*?\})\s*;?\s*\n', html, re.DOTALL)
          if not m:
              # 尝试其他模式
              m = re.search(r'__INITIAL_STATE__\s*[=:]\s*(\{.+\})', html[:50000])
          
          if m:
              try:
                  state = json.loads(m.group(1))
                  print(f"\n__INITIAL_STATE__ keys: {list(state.keys())}")
                  for k, v in state.items():
                      if isinstance(v, dict):
                          print(f"  {k}: dict keys={list(v.keys())[:15]}")
                      elif isinstance(v, list):
                          print(f"  {k}: list len={len(v)}")
                      else:
                          print(f"  {k}: {type(v).__name__} = {str(v)[:80]}")
                  
                  # 深度搜索包含作品/feed/photo/list 的字段
                  def find_posts(obj, path="", depth=0):
                      if depth > 4: return
                      if isinstance(obj, dict):
                          for k, v in obj.items():
                              kl = k.lower()
                              if any(w in kl for w in ["photo", "feed", "post", "video", "work", "list", "count"]):
                                      if isinstance(v, list) and len(v) > 0:
                                          print(f"\n  FOUND LIST at {path}.{k}: len={len(v)}")
                                          if isinstance(v[0], dict):
                                              print(f"    first item keys: {list(v[0].keys())[:15]}")
                                              # 打印第一个作品的 id/caption
                                              for idk in ["id", "photoId", "photo_id", "timestamp", "caption", "time"]:
                                                  if idk in v[0]:
                                                      print(f"    {idk}: {str(v[0][idk])[:80]}")
                              find_posts(v, f"{path}.{k}", depth+1)
                      elif isinstance(obj, list) and len(obj) > 0 and isinstance(obj[0], dict):
                          find_posts(obj[0], f"{path}[0]", depth+1)
                  
                  find_posts(state)
              except json.JSONDecodeError as e:
                  print(f"JSON parse error: {e}")
                  print(f"First 500 chars of match: {m.group(1)[:500]}")
          else:
              print("__INITIAL_STATE__ NOT FOUND in profile page")
              # 看看页面里有什么
              print(f"Page title: {re.search(r'<title>(.*?)</title>', html).group(1) if re.search(r'<title>(.*?)</title>', html) else 'N/A'}")
              # 检查是否被重定向到验证码
              if "captcha" in html.lower():
                  print("Page contains CAPTCHA redirect!")
              # 打印所有 script 标签的 src
              scripts = re.findall(r'<script[^>]*src=["\']([^"\']+)["\']', html)
              print(f"Script srcs: {scripts[:10]}")
              # 打印页面前 2000 字符
              print(f"\nPage start:\n{html[:2000]}")
          PYEOF
