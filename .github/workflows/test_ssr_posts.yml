name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test RSSHub and other approaches
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          PID = "3xrgxqkqp829xz6"
          USER_ID = "2117550"

          # 公共 RSSHub 实例列表
          rsshub_instances = [
              "https://rsshub.app",
              "https://rsshub.rssforever.com",
              "https://rsshub.feeded.xyz",
              "https://hub.slarker.me",
              "https://rsshub.pseudoyu.com",
              "https://rsshub.invert.cloud",
          ]

          print("=== Testing RSSHub instances ===")
          for base in rsshub_instances:
              for path in [f"/kuaishou/user/{USER_ID}", f"/kuaishou/profile/{PID}", f"/kuaishou/user/{PID}"]:
                  url = base + path
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      r = urllib.request.urlopen(req, timeout=10)
                      body = r.read().decode("utf-8", "replace")
                      # 检查是否是有效的 RSS/Atom feed
                      if "<item>" in body or "<entry>" in body:
                          items = body.count("<item>") + body.count("<entry>")
                          titles = re.findall(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>", body)
                          print(f"  ✅ {url}: {r.status}, {items} items")
                          for t in titles[1:4]:
                              print(f"     - {t[:80]}")
                      else:
                          print(f"  ❌ {url}: {r.status}, not a feed ({len(body)} bytes): {body[:100]}")
                  except Exception as e:
                      print(f"  ❌ {url}: {str(e)[:80]}")

          # 也试一些其他第三方服务
          print("\n=== Other services ===")
          other_urls = [
              # 快手开放平台
              f"https://open.kuaishou.com/openapi/user/info?app_id=test&user_id={USER_ID}",
              # 第三方 API
              f"https://www.douyin.com/aweme/v1/web/user/profile/other/?sec_user_id={PID}",
          ]
          for url in other_urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  r = urllib.request.urlopen(req, timeout=10)
                  body = r.read().decode("utf-8", "replace")
                  print(f"  {url[:80]}: {r.status} ({len(body)} bytes): {body[:150]}")
              except Exception as e:
                  print(f"  {url[:80]}: {str(e)[:80]}")
          PYEOF
