name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Cache bust + feed structure
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess, re
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
              print(f"{domain} -> {ip}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  timezone_id="Asia/Shanghai", user_agent=UA)
              page = ctx.new_page()

              # 预热
              print("Warming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)
              except Exception as e:
                  print(f"Warmup: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 拦截 API 并加缓存破坏参数，同时改 hasMore=false
              def bust_cache(route, request):
                  url = request.url
                  if "live_api/profile/public" in url:
                      url = url.replace("hasMore=true", "hasMore=false")
                      url += f"&_t={int(time.time()*1000)}"
                      print(f"  [BUST] {url[-100:]}")
                  route.continue_(url=url)
              page.route("**/live_api/profile/public*", bust_cache)

              api_results = []
              def on_resp(resp):
                  if "live_api/profile/public" in resp.url:
                      try:
                          d = json.loads(resp.body().decode("utf-8","replace"))
                          data = d.get("data", {})
                          lst = data.get("list", [])
                          items = []
                          for item in lst[:12]:
                              poster = item.get("poster", "")
                              dm = re.search(r'/(\d{4}/\d{2}/\d{2})/', poster)
                              items.append(f"{item.get('id')}({dm.group(1) if dm else '?'})")
                          print(f"  API: result={data.get('result')}, list={len(lst)}, pcursor={data.get('pcursor')}")
                          print(f"  items: {items}")
                          api_results.append(data)
                      except: pass
              page.on("response", on_resp)

              # 多次导航测试
              for i in range(3):
                  print(f"\n=== Navigation {i+1} ===")
                  page.goto(f"https://live.kuaishou.com/profile/{PID}?_t={int(time.time()*1000)}",
                           wait_until="domcontentloaded", timeout=30000)
                  page.wait_for_timeout(10000)

              # 也试直接在浏览器里 fetch（带签名由页面 JS 处理）
              print("\n=== Direct fetch from page context ===")
              # 先访问 profile 页让 JS 加载
              page.unroute("**/live_api/profile/public*")
              fetch_result = page.evaluate("""async (pid) => {
                  // 尝试找到签名函数并直接调用 API
                  const results = [];
                  // 方法1: 直接 fetch（不带签名，看错误）
                  try {
                      const r1 = await fetch(`/live_api/profile/public?principalId=${pid}&count=12&privacy=public&caver=2&hasMore=false`, {credentials: 'include'});
                      const d1 = await r1.json();
                      results.push({method: 'no-sig', result: d1.data?.result, count: d1.data?.list?.length});
                  } catch(e) { results.push({method: 'no-sig', error: e.message}); }
                  return results;
              }""", PID)
              print(f"  Direct fetch: {fetch_result}")

              browser.close()
          PYEOF
