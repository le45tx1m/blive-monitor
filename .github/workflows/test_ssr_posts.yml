name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Multi-account + cache bust test
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess, re
          from patchright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
              print(f"{domain} -> {ip}")

          # 先从配置中获取所有快手账号
          import os
          config_path = os.environ.get("BLIVE_CONFIG", "")
          accounts = []
          if config_path:
              try:
                  cfg = json.loads(config_path)
                  for room in cfg.get("rooms", []):
                      if room.get("platform") == "kuaishou":
                          pid = room.get("principal_id", "")
                          name = room.get("name", room.get("id", ""))
                          if pid:
                              accounts.append((pid, name))
              except: pass
          
          if not accounts:
              accounts = [("3xrgxqkqp829xz6", "Sandy88888")]
          print(f"Testing {len(accounts)} accounts: {[a[1] for a in accounts]}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN", user_agent=UA)
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  ctx.add_cookies(cache["cookies"])
              except: pass

              page = ctx.new_page()

              # 预热
              print("\nWarming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)
              except Exception as e:
                  print(f"Warmup error: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              for pid, name in accounts:
                  print(f"\n{'='*50}")
                  print(f"Account: {name} (pid={pid})")
                  api_results = []
                  def make_handler(results):
                      def on_resp(resp):
                          if "live_api/profile/public" in resp.url:
                              try:
                                  d = json.loads(resp.body().decode("utf-8","replace"))
                                  data = d.get("data", {})
                                  lst = data.get("list", [])
                                  items_info = []
                                  for item in lst:
                                      poster = item.get("poster", "")
                                      dm = re.search(r'/(\d{4}/\d{2}/\d{2})/', poster)
                                      items_info.append(f"{item.get('id')}({dm.group(1) if dm else '?'})")
                                  print(f"  API: result={data.get('result')}, list={len(lst)}, pcursor={data.get('pcursor')}, items={items_info}")
                                  results.append(data)
                              except: pass
                      return on_resp
                  
                  handler = make_handler(api_results)
                  page.on("response", handler)
                  
                  page.goto(f"https://live.kuaishou.com/profile/{pid}", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(10000)
                  
                  page.remove_listener("response", handler)
                  time.sleep(2)

              browser.close()
          PYEOF
