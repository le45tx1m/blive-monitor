name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CORS proxies and translation proxies
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, urllib.parse, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          PID = "3xrgxqkqp829xz6"
          TARGET = f"https://live.kuaishou.com/live_api/profile/public?principalId={PID}&count=12&privacy=public"

          proxies = [
              ("allorigins", f"https://api.allorigins.win/raw?url={urllib.parse.quote(TARGET)}"),
              ("corsproxy.io", f"https://corsproxy.io/?{urllib.parse.quote(TARGET)}"),
              ("thingproxy", f"https://thingproxy.freeboard.io/fetch/{TARGET}"),
              ("cors.sh", f"https://proxy.cors.sh/{TARGET}"),
              ("jsonp.afeld", f"https://jsonp.afeld.me/?url={urllib.parse.quote(TARGET)}"),
              ("translate.google", f"https://translate.google.com/translate?sl=zh&tl=en&u={urllib.parse.quote(TARGET)}"),
              ("translate.yandex", f"https://translate.yandex.com/proxy?url={urllib.parse.quote(TARGET)}"),
              ("codetabs", f"https://api.codetabs.com/v1/proxy/?quest={TARGET}"),
              ("whateverorigin", f"https://api.allorigins.win/get?url={urllib.parse.quote(TARGET)}"),
          ]

          for name, purl in proxies:
              try:
                  req = urllib.request.Request(purl, headers={"User-Agent": UA, "Accept": "application/json,*/*"})
                  r = urllib.request.urlopen(req, timeout=15, context=ctx)
                  body = r.read().decode("utf-8", "replace")
                  # Try to find JSON in response
                  try:
                      d = json.loads(body)
                      if "contents" in d:  # allorigins get format
                          d = json.loads(d["contents"])
                      data = d.get("data", d)
                      result = data.get("result")
                      lst = data.get("list", [])
                      print(f"  {name}: result={result}, list={len(lst)} {'✅' if result==1 else ''}")
                  except json.JSONDecodeError:
                      # Check if result=1 or result=2 appears in the body
                      if '"result":1' in body or '"result": 1' in body:
                          print(f"  {name}: FOUND result=1 in non-JSON response! ✅")
                      elif '"result":2' in body or '"result": 2' in body:
                          print(f"  {name}: result=2 (blocked)")
                      else:
                          print(f"  {name}: status={r.status}, non-JSON ({len(body)} bytes): {body[:120]}")
              except Exception as e:
                  print(f"  {name}: ERROR {str(e)[:100]}")
          PYEOF
