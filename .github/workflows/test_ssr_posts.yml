name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dump profile.publicData
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, re, sys

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          url = f"https://live.kuaishou.com/profile/{PID}"
          req = urllib.request.Request(url, headers={"User-Agent": UA, "Referer": "https://live.kuaishou.com/"})
          html = urllib.request.urlopen(req, timeout=15).read().decode("utf-8", "replace")

          idx = html.find("window.__INITIAL_STATE__")
          start = html.index("{", idx)
          depth, end, in_str, escape = 0, start, False, False
          for i in range(start, len(html)):
              c = html[i]
              if escape: escape = False; continue
              if c == "\\": escape = True; continue
              if c == '"': in_str = not in_str; continue
              if in_str: continue
              if c == "{": depth += 1
              elif c == "}":
                  depth -= 1
                  if depth == 0: end = i + 1; break

          state = json.loads(html[start:end])
          profile = state.get("profile", {})
          
          print("=== profile keys ===")
          for k, v in profile.items():
              if isinstance(v, dict):
                  print(f"  {k}: dict keys={list(v.keys())[:15]}")
              elif isinstance(v, list):
                 (f"  {k}: list len={len(v)}")
              else:
                  print(f"  {k}: {str(v)[:100]}")

          pub = profile.get("publicData", {})
          print(f"\n=== publicData type: {type(pub).__name__} ===")
          if isinstance(pub, dict):
              print(f"publicData keys: {list(pub.keys())}")
              for k, v in pub.items():
                  if isinstance(v, list):
                      print(f"\n  {k}: list of {len(v)}")
                      if v and isinstance(v[0], dict):
                          print(f"    first item keys: {list(v[0].keys())[:20]}")
                          item = v[0]
                          for ik in ["id", "photoId", "caption", "timestamp", "coverUrl", "photoUrl", "duration", "likeCount", "viewCount", "time", "type", "momentId"]:
                              if ik in item:
                                  print(f"    {ik}: {str(item[ik])[:120]}")
                          # 也打印完整第一个 item
                          print(f"\n    FULL FIRST ITEM:")
                          print(json.dumps(item, ensure_ascii=False, indent=2)[:2000])
                  elif isinstance(v, dict):
                      print(f"  {k}: {list(v.keys())[:15]}")
                  else:
                      print(f"  {k}: {str(v)[:100]}")
          elif isinstance(pub, list):
              print(f"publicData list of {len(pub)}")
              if pub:
                  print(json.dumps(pub[0], ensure_ascii=False, indent=2)[:2000])
          else:
              print(f"publicData: {str(pub)[:500]}")

          # 也看看 authorInfoById
          aib = state.get("authorInfoById", {})
          print(f"\n=== authorInfoById keys: {list(aib.keys())[:10]} ===")
          for k, v in list(aib.items())[:2]:
              if isinstance(v, dict):
                  print(f"  {k}: {list(v.keys())[:15]}")
                  print(json.dumps(v, ensure_ascii=False, indent=2)[:1000])
          PYEOF
