name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip -q
          pip install patchright -q
          patchright install --with-deps chromium
      - name: Cache bypass tests
        run: |
          python3 << 'PYEOF'
          import json, time, socket, struct, random, subprocess, re
          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

          def dns(name, srv='223.5.5.5'):
              txid=random.randint(0,65535)
              h=struct.pack('>HHHHHH',txid,0x0100,1,0,0,0)
              q=b''.join(bytes([len(p)])+p.encode() for p in name.split('.'))+b'\x00'+struct.pack('>HH',1,1)
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM);s.settimeout(5)
              s.sendto(h+q,(srv,53));d=s.recv(512);s.close()
              i=12
              while d[i]!=0:i+=d[i]+1
              i+=5;anc=struct.unpack('>H',d[6:8])[0];ips=[]
              for _ in range(anc):
                  if d[i]&0xC0==0xC0:i+=2
                  else:
                      while d[i]!=0:i+=d[i]+1
                      i+=1
                  rt,rc,ttl,rl=struct.unpack('>HHIH',d[i:i+10]);i+=10
                  if rt==1 and rl==4:ips.append('.'.join(str(b) for b in d[i:i+4]))
                  i+=rl
              return ips

          for domain in ['live.kuaishou.com', 'www.kuaishou.com']:
              ips = dns(domain)
              ip = next((x for x in ips if x.startswith('103.102.202.')), ips[0])
              subprocess.run(['sudo', 'bash', '-c', f'echo "{ip} {domain}" >> /etc/hosts'], check=True)
              print(f"{domain} -> {ip}")

          def log_result(label, data):
              lst = data.get("list", [])
              items = []
              for item in lst[:12]:
                  poster = item.get("poster", "")
                  dm = re.search(r'/(\d{4}/\d{2}/\d{2})/', poster)
                  items.append(f"{item.get('id')}({dm.group(1) if dm else '?'})")
              print(f"  [{label}] result={data.get('result')}, list={len(lst)}, pcursor={data.get('pcursor')}")
              print(f"  items: {items}")

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  timezone_id="Asia/Shanghai", user_agent=UA)
              page = ctx.new_page()

              # 预热
              print("Warming up www...")
              try:
                  page.goto("https://www.kuaishou.com/", wait_until="domcontentloaded", timeout=20000)
                  page.wait_for_timeout(8000)
              except Exception as e:
                  print(f"Warmup: {e}")
              cookies = {c["name"] for c in ctx.cookies()}
              ab = cookies & {"kwfv1","kwssectoken","kwscode"}
              print(f"Antibot: {sorted(ab)}, did={'did' in cookies}")

              # 测试 1: Cache-Control: no-cache
              print("\n=== Test: Cache-Control no-cache ===")
              def add_nocache(route, request):
                  headers = request.headers.copy()
                  headers["Cache-Control"] = "no-cache, no-store, must-revalidate"
                  headers["Pragma"] = "no-cache"
                  url = request.url.replace("hasMore=true", "hasMore=false")
                  route.continue_(url=url, headers=headers)
              page.route("**/live_api/profile/public*", add_nocache)
              results = []
              def on_resp(resp):
                  if "live_api/profile/public" in resp.url:
                      try: results.append(json.loads(resp.body().decode())["data"])
                      except: pass
              page.on("response", on_resp)
              page.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(12000)
              page.remove_listener("response", on_resp)
              page.unroute("**/live_api/profile/public*")
              for r in results: log_result("no-cache", r)

              # 测试 2: 用 page.evaluate 发 POST 请求
              print("\n=== Test: POST request ===")
              post_result = page.evaluate("""async (pid) => {
                  try {
                      const resp = await fetch(`/live_api/profile/public?principalId=${pid}&count=12&privacy=public&caver=2&hasMore=false`, {
                          method: 'POST',
                          credentials: 'include',
                          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                          body: ''
                      });
                      const d = await resp.json();
                      const data = d.data || {};
                      return {result: data.result, count: (data.list||[]).length, pcursor: data.pcursor,
                              items: (data.list||[]).slice(0,5).map(i => i.id)};
                  } catch(e) { return {error: e.message}; }
              }""", PID)
              print(f"  POST: {post_result}")

              # 测试 3: 用不同的省份 DNS 解析，试不同 CDN 边缘
              print("\n=== Test: Different provincial DNS ===")
              dns_servers = [
                  ("Beijing", "202.106.0.20"),
                  ("Shanghai", "202.96.209.133"),
                  ("Guangdong", "202.96.128.86"),
                  ("Sichuan", "202.98.96.68"),
              ]
              for name, srv in dns_servers:
                  try:
                      ips = dns("live.kuaishou.com", srv)
                      print(f"  {name} ({srv}): {ips}")
                  except Exception as e:
                      print(f"  {name}: {e}")

              browser.close()
          PYEOF
