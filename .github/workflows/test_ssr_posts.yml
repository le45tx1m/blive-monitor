name: Test SSR Posts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: IPv6 + other approaches
        run: |
          python3 << 'PYEOF'
          import socket, urllib.request, json, ssl, struct, random

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          PID = "3xrgxqkqp829xz6"

          # 1. DNS AAAA 记录 (IPv6)
          print("=== IPv6 DNS resolution ===")
          def dns_aaaa(name, server="223.5.5.5"):
              txid = random.randint(0, 65535)
              header = struct.pack(">HHHHHH", txid, 0x0100, 1, 0, 0, 0)
              question = b"".join(bytes([len(p)]) + p.encode() for p in name.split(".")) + b"\x00"
              question += struct.pack(">HH", 28, 1)  # Type AAAA=28, Class IN=1
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              sock.settimeout(5)
              sock.sendto(header + question, (server, 53))
              try:
                  data = sock.recv(512)
              except:
                  return []
              sock.close()
              idx = 12
              while data[idx] != 0: idx += data[idx] + 1
              idx += 5
              ancount = struct.unpack(">H", data[6:8])[0]
              ips = []
              for _ in range(ancount):
                  if data[idx] & 0xC0 == 0xC0: idx += 2
                  else:
                      while data[idx] != 0: idx += data[idx] + 1
                      idx += 1
                  rtype, rclass, ttl, rdlen = struct.unpack(">HHIH", data[idx:idx+10])
                  idx += 10
                  if rtype == 28 and rdlen == 16:  # AAAA
                      ip = socket.inet_ntop(socket.AF_INET6, data[idx:idx+16])
                      ips.append(ip)
                  idx += rdlen
              return ips

          for name in ["live.kuaishou.com", "www.kuaishou.com"]:
              for srv_name, srv in [("AliDNS", "223.5.5.5"), ("Google", "8.8.8.8")]:
                  try:
                      ips = dns_aaaa(name, srv)
                      print(f"  {name} via {srv_name}: {ips}")
                  except Exception as e:
                      print(f"  {name} via {srv_name}: ERROR {e}")

          # 2. 检查 runner 是否有 IPv6
          print("\n=== Runner IPv6 capability ===")
          try:
              s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect(("ipv6.google.com", 443))
              print(f"  IPv6 works! Local: {s.getsockname()}")
              s.close()
          except Exception as e:
              print(f"  IPv6 not available: {e}")

          # 3. 尝试通过 IPv6 访问快手
          print("\n=== Kuaishou via IPv6 ===")
          for name in ["live.kuaishou.com", "www.kuaishou.com"]:
              try:
                  infos = socket.getaddrinfo(name, 443, socket.AF_INET6)
                  for info in infos[:2]:
                      addr = info[4][0]
                      print(f"  {name} -> {addr}")
                      try:
                          req = urllib.request.Request(f"https://{name}/", headers={"User-Agent": UA})
                          r = urllib.request.urlopen(req, timeout=10)
                          print(f"    HTTP {r.status} ({len(r.read())} bytes)")
                      except Exception as e:
                          print(f"    Error: {str(e)[:100]}")
              except Exception as e:
                  print(f"  {name}: getaddrinfo error: {e}")

          # 4. 尝试 Wayback Machine
          print("\n=== Wayback Machine ===")
          try:
              url = f"https://web.archive.org/web/2026/https://live.kuaishou.com/profile/{PID}"
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              r = urllib.request.urlopen(req, timeout=15)
              body = r.read().decode("utf-8", "replace")
              print(f"  Status: {r.status}, URL: {r.url}")
              print(f"  Length: {len(body)}")
              # 检查是否有作品数据
              if "photo" in body.lower() or "作品" in body:
                  import re
                  photos = re.findall(r'3x[a-z0-9]{10,}', body)
                  print(f"  Found photo IDs: {list(set(photos))[:5]}")
          except Exception as e:
              print(f"  Error: {str(e)[:150]}")

          # 5. 尝试 Bing 搜索
          print("\n=== Bing search ===")
          try:
              url = f"https://www.bing.com/search?q=site%3Alive.kuaishou.com+{PID}"
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              r = urllib.request.urlopen(req, timeout=10)
              body = r.read().decode("utf-8", "replace")
              import re
              # 找搜索结果中的链接
              links = re.findall(r'https://live\.kuaishou\.com/short-video/[a-z0-9]+', body)
              print(f"  Found {len(links)} video links")
              for l in list(set(links))[:5]:
                  print(f"    {l}")
          except Exception as e:
              print(f"  Error: {str(e)[:100]}")
          PYEOF
