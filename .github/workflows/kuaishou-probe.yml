name: 快手通道探针

# 一次性诊断：在 GitHub Actions runner 的出口 IP 上复测快手抓取通道，
# 判定本地沙箱观察到的 2001/109 风控是否为「数据中心 IP 段」特有。
# 结果写入 docs/kuaishou_probe_result.json 并提交回本分支，便于外部拉取查看。
on:
  workflow_dispatch:
  push:
    branches:
      - feat/kuaishou-identity
    paths:
      - tools/kuaishou_probe.py
      - .github/workflows/kuaishou-probe.yml

permissions:
  contents: write

concurrency:
  group: kuaishou-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-1.61.2

      - name: Install patchright
        run: |
          python -m pip install --upgrade pip
          pip install patchright
          patchright install --with-deps chromium

      - name: Probe
        run: python3 tools/kuaishou_probe.py

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.com"
          git add docs/kuaishou_probe_result.json || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(probe): 快手通道探针结果（Actions runner 出口 IP） [skip ci]"
          git push origin HEAD:feat/kuaishou-identity
