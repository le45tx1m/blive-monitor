name: Test macOS Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          patchright install chromium
      - name: Test www profile with numeric ID
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          python3 << 'PYEOF'
          import json, logging, urllib.request
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          try:
              ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
              print(f"=== EXIT IP: {ip} ===")
          except Exception as e:
              print(f"IP check failed: {e}")

          from patchright.sync_api import sync_playwright

          # Sandy88888 的数字 ID
          NUMERIC_ID = "2117550"
          PRINCIPAL_ID = "3xrgxqkqp829xz6"

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              cache = json.load(open("kuaishou_guest_visitor.json"))
              ctx.add_cookies(cache["cookies"])
              p = ctx.new_page()

              api_responses = []
              def on_resp(resp):
                  url = resp.url
                  if any(k in url for k in ["rest/v", "graphql", "live_api", "/profile", "/feed", "/photo"]):
                      try:
                          body = resp.body().decode("utf-8","replace")
                          api_responses.append({"url": url[:200], "status": resp.status, "body": body[:800]})
                      except: pass
              p.on("response", on_resp)

              # 预热
              print("Warming up www.kuaishou.com...")
              try:
                  p.goto("https://www.kuaishou.com", wait_until="domcontentloaded", timeout=60000)
                  p.wait_for_timeout(5000)
              except Exception as e:
                  print(f"Warmup: {e}")

              # 尝试不同的 URL 格式
              for url in [
                  f"https://www.kuaishou.com/u/{NUMERIC_ID}",
                  f"https://www.kuaishou.com/profile/{NUMERIC_ID}",
                  f"https://www.kuaishou.com/u/{PRINCIPAL_ID}",
              ]:
                  print(f"\n--- Trying {url} ---")
                  api_responses.clear()
                  try:
                      p.goto(url, wait_until="domcontentloaded", timeout=30000)
                      p.wait_for_timeout(8000)
                      print(f"Final URL: {p.url}")
                      print(f"Title: {p.title()}")
                  except Exception as e:
                      print(f"Error: {e}")

                  print(f"Captured {len(api_responses)} API responses:")
                  for r in api_responses:
                      print(f"\n  [{r['status']}] {r['url']}")
                      # 尝试解析 JSON
                      try:
                          d = json.loads(r["body"])
                          data = d.get("data", d)
                          result = data.get("result", d.get("result"))
                          feeds = data.get("feeds") or data.get("list") or data.get("photoList") or []
                          print(f"  result={result} feeds/list={len(feeds) if isinstance(feeds, list) else 'N/A'}")
                          if feeds and isinstance(feeds, list):
                              for f in feeds[:3]:
                                  photo = f.get("photo", f) if isinstance(f, dict) else {}
                                  print(f"    id={photo.get('id')} caption={str(photo.get('caption',''))[:50]}")
                      except:
                          print(f"  body: {r['body'][:200]}")

              browser.close()
          PYEOF
