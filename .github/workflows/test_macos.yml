name: Test macOS Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          patchright install chromium
      - name: Test www GraphQL on macOS
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          python3 << 'PYEOF'
          import json, logging, urllib.request
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          try:
              ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
              print(f"=== EXIT IP: {ip} ===")
          except Exception as e:
              print(f"IP check failed: {e}")

          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              cache = json.load(open("kuaishou_guest_visitor.json"))
              ctx.add_cookies(cache["cookies"])
              p = ctx.new_page()

              # 拦截所有 GraphQL 和 API 请求
              graphql_responses = []
              def on_resp(resp):
                  url = resp.url
                  if "graphql" in url or ("kuaishou.com" in url and ("profile" in url or "feed" in url or "photo" in url)):
                      try:
                          body = resp.body().decode("utf-8","replace")
                          graphql_responses.append({"url": url[:150], "status": resp.status, "body": body[:500]})
                      except: pass
              p.on("response", on_resp)

              # 先预热
              print("Warming up www.kuaishou.com...")
              try:
                  p.goto("https://www.kuaishou.com", wait_until="domcontentloaded", timeout=60000)
                  p.wait_for_timeout(5000)
              except Exception as e:
                  print(f"Warmup: {e}")

              cookies = {c["name"]: c["value"][:30] for c in ctx.cookies()}
              antibot = [k for k in ("kwfv1","kwssectoken","kwscode") if k in cookies]
              print(f"Antibot cookies: {antibot}")

              # 导航到 www 用户主页
              print(f"\nNavigating to www.kuaishou.com/u/{PID}...")
              # 快手 www 的用户主页 URL 格式
              for url in [f"https://www.kuaishou.com/u/{PID}", f"https://www.kuaishou.com/profile/{PID}"]:
                  try:
                      p.goto(url, wait_until="domcontentloaded", timeout=30000)
                      p.wait_for_timeout(10000)
                      print(f"  Navigated to {url}, final URL: {p.url}")
                      if graphql_responses:
                          break
                  except Exception as e:
                      print(f"  Error navigating to {url}: {e}")

              print(f"\n=== Captured {len(graphql_responses)} API responses ===")
              for r in graphql_responses[:10]:
                  print(f"\n  [{r['status']}] {r['url']}")
                  print(f"  {r['body'][:300]}")

              # 也试试 live_api
              print("\n=== Also testing live_api ===")
              live_responses = [r for r in graphql_responses if "live_api" in r["url"]]
              if not live_responses:
                  # 手动导航到 live profile
                  def on_live(resp):
                      if "live_api/profile/public" in resp.url:
                          try:
                              body = resp.body().decode("utf-8","replace")
                              print(f"  live_api: {resp.status} {body[:300]}")
                          except: pass
                  p.on("response", on_live)
                  try:
                      p.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
                      p.wait_for_timeout(10000)
                  except Exception as e:
                      print(f"  live nav error: {e}")

              browser.close()
          PYEOF
