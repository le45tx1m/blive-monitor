name: Test macOS Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          patchright install chromium
      - name: Detailed live_api test
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          python3 << 'PYEOF'
          import json, logging, urllib.request
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          try:
              ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
              print(f"=== EXIT IP: {ip} ===")
          except Exception as e:
              print(f"IP check failed: {e}")

          from patchright.sync_api import sync_playwright

          PID = "3xrgxqkqp829xz6"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              cache = json.load(open("kuaishou_guest_visitor.json"))
              ctx.add_cookies(cache["cookies"])
              p = ctx.new_page()

              full_response = [None]
              def on_resp(resp):
                  if "live_api/profile/public" in resp.url:
                      try:
                          body = resp.body().decode("utf-8","replace")
                          full_response[0] = body
                          data = json.loads(body)
                          d = data.get("data", {})
                          print(f"\n=== LIVE_API {resp.status} ===")
                          print(f"result: {d.get('result')}")
                          print(f"keys: {list(d.keys())}")
                          lst = d.get("list", [])
                          print(f"list count: {len(lst)}")
                          for item in lst[:5]:
                              photo = item.get("photo", {})
                              print(f"  id={photo.get('id')} caption={str(photo.get('caption',''))[:60]}")
                          live = d.get("live", {})
                          print(f"living: {live.get('author',{}).get('living')}")
                      except Exception as e:
                          print(f"parse error: {e}")
              p.on("response", on_resp)

              # 预热
              print("Warming up www.kuaishou.com...")
              try:
                  p.goto("https://www.kuaishou.com", wait_until="domcontentloaded", timeout=60000)
                  p.wait_for_timeout(5000)
              except Exception as e:
                  print(f"Warmup: {e}")

              cookies = {c["name"]: c["value"][:30] for c in ctx.cookies()}
              antibot = [k for k in ("kwfv1","kwssectoken","kwscode") if k in cookies]
              print(f"Antibot cookies: {antibot}")

              # 直接导航到 live profile
              print(f"\nNavigating to live profile {PID}...")
              try:
                  p.goto(f"https://live.kuaishou.com/profile/{PID}", wait_until="domcontentloaded", timeout=30000)
                  p.wait_for_timeout(15000)
              except Exception as e:
                  print(f"Nav error: {e}")

              if full_response[0]:
                  print(f"\nFull response length: {len(full_response[0])}")
                  # 打印前 1000 字符
                  print(f"Full response (first 1000): {full_response[0][:1000]}")
              else:
                  print("\nNo live_api response captured!")
                  print(f"Final URL: {p.url}")

              browser.close()
          PYEOF
