name: Test macOS Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m patchright install chromium
      - name: Run kuaishou feed check
        env:
          ENABLE_POST_CHECK: "true"
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== IP ==="
          curl -s --max-time 10 https://ifconfig.me
          echo ""
          echo "=== post_rooms count ==="
          python3 -c "import json; d=json.load(open('post_rooms.json')); print(len(d), 'accounts'); [print(' ', x) for x in d]"
          echo "=== Run check_new_posts.py ==="
          python3 check_new_posts.py 2>&1 | tail -60
