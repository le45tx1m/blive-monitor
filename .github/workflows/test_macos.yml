name: Test macOS Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          patchright install chromium
      - name: Fresh DID test
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          python3 << 'PYEOF'
          import json, logging, urllib.request, os
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          try:
              ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode()
              print(f"=== EXIT IP: {ip} ===")
          except Exception as e:
              print(f"IP check failed: {e}")

          # 删除缓存的 DID，强制生成全新访客身份
          if os.path.exists("kuaishou_guest_visitor.json"):
              os.remove("kuaishou_guest_visitor.json")
              print("Deleted cached DID, will generate fresh one")

          from patchright.sync_api import sync_playwright
          from backend.adapters.kuaishou_feed import KuaishouFeedSession, reset_guest_visitor_cache

          reset_guest_visitor_cache()

          PID = "3xrgxqkqp829xz6"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              # 不注入缓存 cookie，让浏览器生成全新身份
              p = ctx.new_page()

              session = KuaishouFeedSession(ctx, "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              result = session.fetch(PID)
              print(f"\n{'='*60}")
              print(f"ok={result.get('ok')} result={result.get('result')} items={len(result.get('items',[]))}")
              for item in result.get("items", [])[:5]:
                  photo = item.get("photo", item) if isinstance(item, dict) else {}
                  print(f"  id={photo.get('id')} caption={str(photo.get('caption',''))[:60]}")
              print(f"seen: {result.get('seen')}")

              # 打印新生成的 DID
              try:
                  cache = json.load(open("kuaishou_guest_visitor.json"))
                  print(f"New DID: {cache.get('did','?')[:30]}")
              except:
                  pass

              browser.close()
          PYEOF
