name: Test WARP Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Cloudflare WARP
        run: |
          # 安装 Cloudflare WARP 客户端
          curl https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          # 注册并连接（无需账号）
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          # WARP 在 40000 端口提供 SOCKS5 代理
          echo "WARP proxy status:"
          warp-cli --accept-tos status || true
          # 测试通过 WARP 代理的出口 IP
          echo "Direct IP: $(curl -s https://api.ipify.org)"
          echo "WARP IP: $(curl -s --socks5-hostname 127.0.0.1:40000 https://api.ipify.org 2>/dev/null || echo 'FAILED')"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          patchright install --with-deps chromium
      - name: Test Kuaishou via WARP
        env:
          BLIVE_CONFIG: ${{ secrets.BLIVE_CONFIG }}
        run: |
          python3 << 'PYEOF'
          import json, logging, urllib.request
          logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(message)s")

          # 通过 WARP 代理检查 IP
          try:
              proxy = urllib.request.ProxyHandler({"https": "socks5h://127.0.0.1:40000", "http": "socks5h://127.0.0.1:40000"})
              opener = urllib.request.build_opener(proxy)
              ip = opener.open("https://api.ipify.org", timeout=15).read().decode()
              print(f"=== WARP EXIT IP: {ip} ===")
          except Exception as e:
              print(f"WARP IP check failed: {e}")

          from patchright.sync_api import sync_playwright
          from backend.adapters.kuaishou_feed import KuaishouFeedSession

          PID = "3xrgxqkqp829xz6"
          with sync_playwright() as pw:
              browser = pw.chromium.launch(
                  headless=True,
                  proxy={"server": "socks5://127.0.0.1:40000"},
                  args=["--no-sandbox","--disable-dev-shm-usage"])
              ctx = browser.new_context(viewport={"width":1366,"height":900}, locale="zh-CN",
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              cache = json.load(open("kuaishou_guest_visitor.json"))
              ctx.add_cookies(cache["cookies"])

              session = KuaishouFeedSession(ctx, "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
              result = session.fetch(PID)
              print(f"\n{'='*60}")
              print(f"ok={result.get('ok')} result={result.get('result')} items={len(result.get('items',[]))}")
              for item in result.get("items", [])[:5]:
                  photo = item.get("photo", item) if isinstance(item, dict) else {}
                  print(f"  id={photo.get('id')} caption={str(photo.get('caption',''))[:60]}")
              print(f"seen: {result.get('seen')}")
              browser.close()
          PYEOF
