name: Test WARP Kuaishou Access
on:
  workflow_dispatch:
jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detailed Windows kuaishou test
        run: |
          python -c "
          import urllib.request, json

          # 检查 IP
          ip = urllib.request.urlopen('https://api.ipify.org', timeout=10).read().decode()
          print(f'IP: {ip}')

          # 直接请求 live_api（不带 cookie，看 result）
          url = 'https://live.kuaishou.com/live_api/profile/public?principalId=3xrgxqkqp829xz6&count=12&privacy=public'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Referer': 'https://live.kuaishou.com/',
              'Accept': 'application/json',
          })
          try:
              r = urllib.request.urlopen(req, timeout=15)
              body = r.read().decode('utf-8', 'replace')
              print(f'Status: {r.status}')
              print(f'Body length: {len(body)}')
              d = json.loads(body)
              data = d.get('data', {})
              print(f'result: {data.get(\"result\")}')
              print(f'keys: {list(data.keys())}')
              lst = data.get('list', [])
              print(f'list count: {len(lst)}')
              for item in lst[:5]:
                  photo = item.get('photo', {})
                  print(f'  id={photo.get(\"id\")} caption={str(photo.get(\"caption\",\"\"))[:60]}')
              live = data.get('live', {})
              print(f'living: {live.get(\"author\",{}).get(\"living\")}')
          except Exception as e:
              print(f'Error: {e}')
          "
