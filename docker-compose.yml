# blive-monitor 后端服务（阶段四）
# 构建当前目录镜像，挂载 sqlite 库与封面目录，可选 Bearer 鉴权。
services:
  blive-monitor:
    build: .
    container_name: blive-monitor
    ports:
      - "8000:8000"
    environment:
      # ⚠️ 公网暴露 8000 端口时必须设置强随机值，否则 API 写接口无鉴权！
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # 默认不自启调度器；如需后端自驱检测设为 "true"。
      - START_SCHEDULER=${START_SCHEDULER:-false}
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./assets/covers:/app/assets/covers
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
